function EstadoResultados() {
  const [selectedMonth, setSelectedMonth] = useState(monthKey(todayStr()));
  const [entries, setEntries] = useState([]);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [openSet, setOpenSet] = useState(() => new Set());
  const [printExpand, setPrintExpand] = useState(false);

  useEffect(() => {
    const unsub = db.collection("entries").onSnapshot(
      (snap) => { setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); setError(null); },
      () => { setError("No se pudo cargar el informe."); setLoading(false); }
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    const unsub = db.collection("categories").onSnapshot((snap) => setCategories(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return () => unsub();
  }, []);

  const categoriaAGrupo = useMemo(() => {
    const map = {};
    categories.forEach((c) => { map[c.nombre.trim().toLowerCase()] = (c.grupo && c.grupo.trim()) || GRUPO_SIN_ASIGNAR; });
    return map;
  }, [categories]);

  useEffect(() => {
    function onAfterPrint() { setPrintExpand(false); }
    window.addEventListener("afterprint", onAfterPrint);
    return () => window.removeEventListener("afterprint", onAfterPrint);
  }, []);

  const months = useMemo(() => {
    const set = new Set(entries.map((e) => monthKey(e.fecha)));
    set.add(monthKey(todayStr()));
    return Array.from(set).sort().reverse();
  }, [entries]);

  const monthEntries = useMemo(() => entries.filter((e) => monthKey(e.fecha) === selectedMonth), [entries, selectedMonth]);

  const diezmoEntries = useMemo(() => monthEntries.filter((e) => e.tipo === "diezmo").sort((a, b) => (a.fecha < b.fecha ? 1 : -1)), [monthEntries]);
  const ofrendaEntries = useMemo(() => monthEntries.filter((e) => e.tipo === "ofrenda").sort((a, b) => (a.fecha < b.fecha ? 1 : -1)), [monthEntries]);
  const salidaEntries = useMemo(() => monthEntries.filter((e) => e.tipo === "salida"), [monthEntries]);

  const salidasPorGrupo = useMemo(() => {
    const grupos = {};
    for (const e of salidaEntries) {
      const categoria = e.categoria && e.categoria.trim() ? e.categoria.trim() : "Sin categoría";
      const grupo = categoriaAGrupo[categoria.toLowerCase()] || GRUPO_SIN_ASIGNAR;
      if (!grupos[grupo]) grupos[grupo] = { total: 0, categorias: {} };
      grupos[grupo].total += e.monto;
      if (!grupos[grupo].categorias[categoria]) grupos[grupo].categorias[categoria] = { total: 0, items: [] };
      grupos[grupo].categorias[categoria].total += e.monto;
      grupos[grupo].categorias[categoria].items.push(e);
    }
    return Object.entries(grupos)
      .map(([grupo, datos]) => ({
        grupo, total: datos.total,
        categorias: Object.entries(datos.categorias)
          .map(([categoria, cd]) => ({ categoria, ...cd, items: cd.items.sort((a, b) => (a.fecha < b.fecha ? 1 : -1)) }))
          .sort((a, b) => b.total - a.total),
      }))
      .sort((a, b) => b.total - a.total);
  }, [salidaEntries, categoriaAGrupo]);

  const totales = useMemo(() => {
    const diezmos = diezmoEntries.reduce((s, e) => s + e.monto, 0);
    const ofrendas = ofrendaEntries.reduce((s, e) => s + e.monto, 0);
    const salidas = salidaEntries.reduce((s, e) => s + e.monto, 0);
    const remesa = diezmos * PORCENTAJE_REMESA;
    const ingresos = diezmos + ofrendas;
    return { diezmos, ofrendas, salidas, remesa, ingresos, disponible: ingresos - remesa - salidas };
  }, [diezmoEntries, ofrendaEntries, salidaEntries]);

  function toggle(key) {
    setOpenSet((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  }

  function isOpen(key) {
    return printExpand || openSet.has(key);
  }

  function handlePrint() {
    setPrintExpand(true);
    setTimeout(() => window.print(), 150);
  }

  return (
    <div>
      <h1 className="rd-display" style={{ margin: "0 0 16px", fontSize: 24, fontWeight: 600 }}>Estado de resultados — {monthLabel(selectedMonth)}</h1>

      <PrintButton onClick={handlePrint} />

      <div className="rd-scroll no-print" style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4, marginBottom: 20 }}>
        {months.map((m) => (
          <button key={m} className="rd-btn rd-anim" onClick={() => setSelectedMonth(m)} style={{ flexShrink: 0, padding: "9px 15px", borderRadius: 999, fontSize: 14.5, fontWeight: 600, background: m === selectedMonth ? "var(--ink)" : "transparent", color: m === selectedMonth ? "var(--paper)" : "var(--muted)", border: `1px solid ${m === selectedMonth ? "var(--ink)" : "var(--paper-line)"}` }}>
            {monthLabel(m)}
          </button>
        ))}
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "var(--clay)", padding: "10px 14px", borderRadius: 10, fontSize: 14.5, marginBottom: 12 }}>{error}</div>}

      {loading ? (
        <div style={{ color: "var(--muted)", fontSize: 15.5, textAlign: "center", padding: "24px 0" }}>Cargando…</div>
      ) : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
            <SummaryCard iconName="trendUp" label="Total ingresos" value={totales.ingresos} color="var(--sage)" />
            <SummaryCard iconName="trendDown" label="Total gastos" value={totales.salidas} color="var(--clay)" />
          </div>

          <div className="rd-display" style={{ fontSize: 13.5, fontWeight: 700, color: "var(--muted)", margin: "4px 0 8px", textTransform: "uppercase", letterSpacing: "0.06em" }}>Ingresos</div>

          <AccountRow title="Diezmos" iconName="handCoins" color="var(--wood)" total={totales.diezmos} count={diezmoEntries.length} isOpen={isOpen("diezmos")} onToggle={() => toggle("diezmos")}>
            {diezmoEntries.length === 0 ? (
              <div style={{ fontSize: 13.5, color: "var(--muted)", padding: "6px 0" }}>Sin diezmos este mes.</div>
            ) : diezmoEntries.map((e) => (
              <DetailLine key={e.id} left={e.persona || "Sin especificar"} sub={dateLabel(e.fecha)} right={currency(e.monto)} />
            ))}
          </AccountRow>

          <AccountRow title="Ofrendas" iconName="trendUp" color="var(--gold)" total={totales.ofrendas} count={ofrendaEntries.length} isOpen={isOpen("ofrendas")} onToggle={() => toggle("ofrendas")}>
            {ofrendaEntries.length === 0 ? (
              <div style={{ fontSize: 13.5, color: "var(--muted)", padding: "6px 0" }}>Sin ofrendas este mes.</div>
            ) : ofrendaEntries.map((e) => (
              <DetailLine key={e.id} left={e.persona || e.descripcion || "Ofrenda"} sub={dateLabel(e.fecha)} right={currency(e.monto)} />
            ))}
          </AccountRow>

          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, color: "var(--muted)", padding: "6px 4px 16px" }}>
            <span>Remesa a iglesia nacional (10% de diezmos)</span>
            <span className="rd-mono" style={{ color: "var(--wood)", fontWeight: 600 }}>− {currency(totales.remesa)}</span>
          </div>

          <div className="rd-display" style={{ fontSize: 13.5, fontWeight: 700, color: "var(--muted)", margin: "4px 0 8px", textTransform: "uppercase", letterSpacing: "0.06em" }}>Gastos / Salidas</div>

          {salidasPorGrupo.length === 0 ? (
            <div style={{ border: "1px dashed var(--paper-line)", borderRadius: 12, padding: "20px 16px", textAlign: "center", color: "var(--muted)", fontSize: 14.5, marginBottom: 16 }}>Sin salidas registradas este mes.</div>
          ) : salidasPorGrupo.map((g) => (
            <div key={g.grupo} style={{ marginBottom: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "0 4px 8px" }}>
                <span style={{ fontSize: 13.5, fontWeight: 700, color: "var(--ink)" }}>{g.grupo}</span>
                <span className="rd-mono" style={{ fontSize: 13.5, fontWeight: 700, color: "var(--clay)" }}>{currency(g.total)}</span>
              </div>
              <div style={{ paddingLeft: 10, borderLeft: "2px solid var(--paper-line)" }}>
                {g.categorias.map((cat) => (
                  <AccountRow key={cat.categoria} title={cat.categoria} iconName="tags" color="var(--clay)" total={cat.total} count={cat.items.length} isOpen={isOpen("cat-" + g.grupo + "-" + cat.categoria)} onToggle={() => toggle("cat-" + g.grupo + "-" + cat.categoria)}>
                    {cat.items.map((e) => (
                      <DetailLine key={e.id} left={e.descripcion || "Sin descripción"} sub={dateLabel(e.fecha)} right={currency(e.monto)} />
                    ))}
                  </AccountRow>
                ))}
              </div>
            </div>
          ))}

          <div className="rd-card-dark" style={{ background: "var(--ink)", borderRadius: 14, padding: "16px", marginTop: 20 }}>
            <div style={{ color: "rgba(250,246,240,0.65)", fontSize: 13.5, fontWeight: 600, marginBottom: 10 }}>Disponible neto para la iglesia local</div>
            <div style={{ fontSize: 13, color: "rgba(250,246,240,0.5)", marginBottom: 4 }}>(diezmos + ofrendas) − remesa 10% − gastos</div>
            <div className="rd-mono" style={{ color: "var(--paper)", fontSize: 23, fontWeight: 600, marginTop: 6 }}>{currency(totales.disponible)}</div>
          </div>
        </>
      )}
    </div>
  );
}

// ============ INFORME TRIMESTRAL ============
function InformeTrimestral() {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [quarter, setQuarter] = useState(Math.floor(today.getMonth() / 3) + 1);
  const [entries, setEntries] = useState([]);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    const unsub = db.collection("entries").onSnapshot(
      (snap) => { setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); setError(null); },
      () => { setError("No se pudo cargar el informe."); setLoading(false); }
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    const unsub = db.collection("categories").onSnapshot((snap) => setCategories(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return () => unsub();
  }, []);

  const categoriaAGrupo = useMemo(() => {
    const map = {};
    categories.forEach((c) => { map[c.nombre.trim().toLowerCase()] = (c.grupo && c.grupo.trim()) || GRUPO_SIN_ASIGNAR; });
    return map;
  }, [categories]);

  const years = useMemo(() => {
    const set = new Set(entries.map((e) => Number(e.fecha.slice(0, 4))));
    set.add(today.getFullYear());
    return Array.from(set).sort((a, b) => b - a);
  }, [entries]);

  const monthsInQuarter = useMemo(() => {
    const startMonth = (quarter - 1) * 3 + 1;
    return [startMonth, startMonth + 1, startMonth + 2].map((m) => `${year}-${String(m).padStart(2, "0")}`);
  }, [year, quarter]);

  const monthStats = useMemo(() => {
    return monthsInQuarter.map((mKey) => {
      const monthEntries = entries.filter((e) => monthKey(e.fecha) === mKey);
      const diezmos = monthEntries.filter((e) => e.tipo === "diezmo").reduce((s, e) => s + e.monto, 0);
      const ofrendas = monthEntries.filter((e) => e.tipo === "ofrenda").reduce((s, e) => s + e.monto, 0);
      const remesa = diezmos * PORCENTAJE_REMESA;
      const salidaEntries = monthEntries.filter((e) => e.tipo === "salida");
      const gruposMap = {};
      for (const e of salidaEntries) {
        const categoria = e.categoria && e.categoria.trim() ? e.categoria.trim() : "Sin categoría";
        const grupo = categoriaAGrupo[categoria.toLowerCase()] || GRUPO_SIN_ASIGNAR;
        if (!gruposMap[grupo]) gruposMap[grupo] = { total: 0, categorias: {} };
        gruposMap[grupo].total += e.monto;
        gruposMap[grupo].categorias[categoria] = (gruposMap[grupo].categorias[categoria] || 0) + e.monto;
      }
      const salidas = salidaEntries.reduce((s, e) => s + e.monto, 0);
      const ingresos = diezmos + ofrendas;
      const balance = ingresos - remesa - salidas;
      return { mKey, diezmos, ofrendas, remesa, salidas, ingresos, balance, gruposMap };
    });
  }, [entries, monthsInQuarter, categoriaAGrupo]);

  const estructuraGastos = useMemo(() => {
    const gruposSet = new Set();
    monthStats.forEach((m) => Object.keys(m.gruposMap).forEach((g) => gruposSet.add(g)));
    return Array.from(gruposSet).sort().map((grupo) => {
      const categoriasSet = new Set();
      monthStats.forEach((m) => { if (m.gruposMap[grupo]) Object.keys(m.gruposMap[grupo].categorias).forEach((c) => categoriasSet.add(c)); });
      return { grupo, categorias: Array.from(categoriasSet).sort() };
    });
  }, [monthStats]);

  const totalTrimestre = useMemo(() => {
    const diezmos = monthStats.reduce((s, m) => s + m.diezmos, 0);
    const ofrendas = monthStats.reduce((s, m) => s + m.ofrendas, 0);
    const remesa = monthStats.reduce((s, m) => s + m.remesa, 0);
    const salidas = monthStats.reduce((s, m) => s + m.salidas, 0);
    const ingresos = diezmos + ofrendas;
    const balance = ingresos - remesa - salidas;
    const grupoTotal = (grupo) => monthStats.reduce((s, m) => s + (m.gruposMap[grupo] ? m.gruposMap[grupo].total : 0), 0);
    const categoriaTotal = (grupo, categoria) => monthStats.reduce((s, m) => s + ((m.gruposMap[grupo] && m.gruposMap[grupo].categorias[categoria]) || 0), 0);
    return { diezmos, ofrendas, remesa, salidas, ingresos, balance, grupoTotal, categoriaTotal };
  }, [monthStats]);

  function grupoMes(m, grupo) { return m.gruposMap[grupo] ? m.gruposMap[grupo].total : 0; }
  function categoriaMes(m, grupo, categoria) { return (m.gruposMap[grupo] && m.gruposMap[grupo].categorias[categoria]) || 0; }

  const cellStyle = { padding: "9px 12px", fontSize: 13.5, whiteSpace: "nowrap", textAlign: "right" };
  const labelCellStyle = { padding: "9px 12px", fontSize: 13.5, textAlign: "left", color: "var(--muted)", position: "sticky", left: 0, background: "#fff" };

  return (
    <div>
      <h1 className="rd-display" style={{ margin: "0 0 16px", fontSize: 24, fontWeight: 600 }}>Estado de resultados trimestral</h1>

      <PrintButton />

      <div className="no-print" style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
        <select className="rd-select" value={year} onChange={(e) => setYear(Number(e.target.value))} style={{ ...inputStyle, width: "auto", flex: "1 0 100px" }}>
          {years.map((y) => <option key={y} value={y}>{y}</option>)}
        </select>
        <select className="rd-select" value={quarter} onChange={(e) => setQuarter(Number(e.target.value))} style={{ ...inputStyle, width: "auto", flex: "1 0 160px" }}>
          <option value={1}>Trimestre 1 (Ene–Mar)</option>
          <option value={2}>Trimestre 2 (Abr–Jun)</option>
          <option value={3}>Trimestre 3 (Jul–Sep)</option>
          <option value={4}>Trimestre 4 (Oct–Dic)</option>
        </select>
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "var(--clay)", padding: "10px 14px", borderRadius: 10, fontSize: 14.5, marginBottom: 12 }}>{error}</div>}

      {loading ? (
        <div style={{ color: "var(--muted)", fontSize: 15.5, textAlign: "center", padding: "24px 0" }}>Cargando…</div>
      ) : (
        <div className="rd-scroll" style={{ overflowX: "auto", border: "1px solid var(--paper-line)", borderRadius: 14, background: "#fff" }}>
          <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 560 }}>
            <thead>
              <tr style={{ borderBottom: "2px solid var(--paper-line)" }}>
                <th style={{ ...labelCellStyle, fontWeight: 700, color: "var(--ink)" }}>Concepto</th>
                {monthStats.map((m) => (
                  <th key={m.mKey} className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--ink)" }}>{monthLabel(m.mKey).split(" ")[0]}</th>
                ))}
                <th className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--wood)", background: "#FBF3E9" }}>Total trimestre</th>
              </tr>
            </thead>
            <tbody>
              <tr style={{ borderBottom: "1px solid var(--paper-line)" }}>
                <td style={labelCellStyle}>Diezmos</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={cellStyle}>{currency(m.diezmos)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 600, background: "#FBF3E9" }}>{currency(totalTrimestre.diezmos)}</td>
              </tr>
              <tr style={{ borderBottom: "1px solid var(--paper-line)" }}>
                <td style={labelCellStyle}>Ofrendas</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={cellStyle}>{currency(m.ofrendas)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 600, background: "#FBF3E9" }}>{currency(totalTrimestre.ofrendas)}</td>
              </tr>
              <tr style={{ borderBottom: "1px solid var(--paper-line)" }}>
                <td style={{ ...labelCellStyle, fontWeight: 700, color: "var(--sage)", background: "#FAF6F0" }}>Total ingresos</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--sage)", background: "#FAF6F0" }}>{currency(m.ingresos)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--sage)", background: "#FBF3E9" }}>{currency(totalTrimestre.ingresos)}</td>
              </tr>
              <tr style={{ borderBottom: "1px solid var(--paper-line)" }}>
                <td style={labelCellStyle}>Remesa (10% diezmos)</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={cellStyle}>− {currency(m.remesa)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 600, background: "#FBF3E9" }}>− {currency(totalTrimestre.remesa)}</td>
              </tr>
              {estructuraGastos.map((g) => (
                <React.Fragment key={g.grupo}>
                  {g.categorias.map((cat) => (
                    <tr key={cat} style={{ borderBottom: "1px solid var(--paper-line)" }}>
                      <td style={{ ...labelCellStyle, paddingLeft: 26 }}>{cat}</td>
                      {monthStats.map((m) => {
                        const v = categoriaMes(m, g.grupo, cat);
                        return <td key={m.mKey} className="rd-mono" style={cellStyle}>{v ? `− ${currency(v)}` : "—"}</td>;
                      })}
                      <td className="rd-mono" style={{ ...cellStyle, fontWeight: 600, background: "#FBF3E9" }}>
                        {(() => { const t = totalTrimestre.categoriaTotal(g.grupo, cat); return t ? `− ${currency(t)}` : "—"; })()}
                      </td>
                    </tr>
                  ))}
                  <tr style={{ borderBottom: "1px solid var(--paper-line)", background: "#FAF6F0" }}>
                    <td style={{ ...labelCellStyle, fontWeight: 700, background: "#FAF6F0" }}>Total {g.grupo}</td>
                    {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={{ ...cellStyle, fontWeight: 700 }}>− {currency(grupoMes(m, g.grupo))}</td>)}
                    <td className="rd-mono" style={{ ...cellStyle, fontWeight: 700, background: "#FBF3E9" }}>− {currency(totalTrimestre.grupoTotal(g.grupo))}</td>
                  </tr>
                </React.Fragment>
              ))}
              <tr style={{ borderBottom: "1px solid var(--paper-line)" }}>
                <td style={{ ...labelCellStyle, fontWeight: 700, color: "var(--clay)" }}>Total gastos</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--clay)" }}>− {currency(m.salidas)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--clay)", background: "#FBF3E9" }}>− {currency(totalTrimestre.salidas)}</td>
              </tr>
              <tr>
                <td style={{ ...labelCellStyle, fontWeight: 700, color: "var(--paper)", background: "var(--ink)" }}>Balance</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--paper)", background: "var(--ink)" }}>{currency(m.balance)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--paper)", background: "var(--ink)" }}>{currency(totalTrimestre.balance)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ============ REGISTRO (pantalla principal) ============
// ============ INICIO (resumen tipo Pastor + lista editable) ============
function Inicio({ user, onIrRegistro }) {
  const [entries, setEntries] = useState([]);
  const [members, setMembers] = useState([]);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [monthOffset, setMonthOffset] = useState(0);
  const [filtroTipo, setFiltroTipo] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [informe, setInforme] = useState(null); // null | "mes" | "trimestre"

  const [form, setForm] = useState({ fecha: "", tipo: "diezmo", monto: "", descripcion: "", persona: "", categoria: "", metodoPago: "efectivo" });

  useEffect(() => {
    const unsub = db.collection("entries").orderBy("fecha", "desc").onSnapshot(
      (snap) => { setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); setError(null); },
      () => { setError("No se pudieron cargar los registros. Revisa tu conexión."); setLoading(false); }
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    const unsub = db.collection("members").orderBy("nombre").onSnapshot((snap) => setMembers(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return () => unsub();
  }, []);

  useEffect(() => {
    const unsub = db.collection("categories").orderBy("nombre").onSnapshot((snap) => setCategories(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return () => unsub();
  }, []);

  function closeForm() {
    setShowForm(false);
    setEditingId(null);
    setForm({ fecha: "", tipo: "diezmo", monto: "", descripcion: "", persona: "", categoria: "", metodoPago: "efectivo" });
  }

  function openEditForm(entry) {
    setForm({
      fecha: entry.fecha, tipo: entry.tipo, monto: String(entry.monto),
      descripcion: entry.descripcion || "", persona: entry.persona || "",
      categoria: entry.categoria || "", metodoPago: entry.metodoPago || "efectivo",
    });
    setEditingId(entry.id);
    setShowForm(true);
  }

  async function handleCreateMember(nombre) {
    const trimmed = nombre.trim();
    if (!trimmed) return;
    const yaExiste = members.some((m) => m.nombre.trim().toLowerCase() === trimmed.toLowerCase());
    if (yaExiste) return;
    try { await db.collection("members").add({ nombre: trimmed }); } catch (err) {}
  }

  async function handleCreateCategory(nombre) {
    const trimmed = nombre.trim();
    if (!trimmed) return;
    const yaExiste = categories.some((c) => c.nombre.trim().toLowerCase() === trimmed.toLowerCase());
    if (yaExiste) return;
    try { await db.collection("categories").add({ nombre: trimmed, grupo: GRUPO_SIN_ASIGNAR }); } catch (err) {}
  }

  async function handleSave(e) {
    e.preventDefault();
    if (!editingId || !form.fecha || !form.monto || Number(form.monto) <= 0) return;
    const payload = {
      fecha: form.fecha, tipo: form.tipo, monto: Number(form.monto),
      descripcion: form.descripcion.trim(), persona: form.persona.trim(),
      categoria: form.tipo === "salida" ? form.categoria : "",
      metodoPago: form.metodoPago,
    };
    try {
      await db.collection("entries").doc(editingId).update(payload);
      closeForm();
    } catch (err) {
      setError("No se pudo guardar el movimiento. Intenta de nuevo.");
    }
  }

  async function handleDelete(id) {
    try {
      await db.collection("entries").doc(id).delete();
    } catch (err) {
      setError("No se pudo eliminar el movimiento.");
    }
  }

  const viewKey = useMemo(() => {
    const d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() + monthOffset);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  }, [monthOffset]);

  const monthEntries = useMemo(() => entries.filter((e) => monthKey(e.fecha) === viewKey).sort((a, b) => (a.fecha < b.fecha ? 1 : -1)), [entries, viewKey]);

  const totals = useMemo(() => {
    let diezmos = 0, ofrendas = 0, salidas = 0;
    for (const e of monthEntries) {
      if (e.tipo === "diezmo") diezmos += e.monto;
      else if (e.tipo === "ofrenda") ofrendas += e.monto;
      else if (e.tipo === "salida") salidas += e.monto;
    }
    return { diezmos, ofrendas, salidas, balance: diezmos + ofrendas - salidas };
  }, [monthEntries]);

  const visibleEntries = useMemo(() => (filtroTipo ? monthEntries.filter((e) => e.tipo === filtroTipo) : monthEntries), [monthEntries, filtroTipo]);

  function toggleFiltro(tipo) {
    setFiltroTipo((f) => (f === tipo ? null : tipo));
  }

  if (informe) {
    return (
      <div>
        <button className="rd-btn no-print" onClick={() => setInforme(null)} style={{ display: "flex", alignItems: "center", gap: 6, color: "var(--muted)", fontWeight: 600, fontSize: 14.5, marginBottom: 16 }}>
          <Icon name="chevron" size={16} style={{ transform: "rotate(90deg)" }} /> Volver
        </button>
        {informe === "mes" ? <EstadoResultados /> : <InformeTrimestral />}
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <div style={{ fontSize: 13, color: "var(--muted)", letterSpacing: "0.06em", textTransform: "uppercase", fontWeight: 700 }}>Iglesia · Tesorería</div>
      </div>
      <h1 className="rd-display" style={{ margin: "0 0 16px", fontSize: 26, fontWeight: 600, color: "var(--ink)" }}>Resumen del mes</h1>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
        <button className="rd-btn" onClick={() => setMonthOffset((o) => o - 1)} aria-label="Mes anterior" style={{ width: 44, height: 44, borderRadius: 12, border: "1px solid var(--paper-line)", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="chevron" size={17} style={{ transform: "rotate(90deg)" }} />
        </button>
        <div className="rd-display" style={{ fontSize: 19, fontWeight: 600 }}>{monthLabel(viewKey)}</div>
        <button className="rd-btn" onClick={() => setMonthOffset((o) => Math.min(0, o + 1))} disabled={monthOffset >= 0} aria-label="Mes siguiente" style={{ width: 44, height: 44, borderRadius: 12, border: "1px solid var(--paper-line)", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", opacity: monthOffset >= 0 ? 0.35 : 1 }}>
          <Icon name="chevron" size={17} style={{ transform: "rotate(-90deg)" }} />
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
        <SummaryCard iconName="handCoins" label="Diezmos" value={totals.diezmos} color="var(--wood)" onClick={() => toggleFiltro("diezmo")} active={filtroTipo === "diezmo"} />
        <SummaryCard iconName="trendUp" label="Ofrendas" value={totals.ofrendas} color="var(--gold)" onClick={() => toggleFiltro("ofrenda")} active={filtroTipo === "ofrenda"} />
        <SummaryCard iconName="trendDown" label="Salidas" value={totals.salidas} color="var(--clay)" onClick={() => toggleFiltro("salida")} active={filtroTipo === "salida"} />
        <button className="rd-btn rd-anim rd-card-dark" type="button" onClick={() => setFiltroTipo(null)} style={{ background: "var(--ink)", borderRadius: 16, padding: "14px 16px", display: "flex", flexDirection: "column", justifyContent: "space-between", textAlign: "left", width: "100%", boxSizing: "border-box" }}>
          <div style={{ color: "rgba(250,246,240,0.65)", fontSize: 13.5, fontWeight: 600, marginBottom: 8 }}>Balance</div>
          <div className="rd-mono" style={{ color: "var(--paper)", fontSize: 22, fontWeight: 600 }}>{currency(totals.balance)}</div>
        </button>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <button className="rd-btn rd-anim" onClick={() => setInforme("mes")} style={{ flex: 1, padding: "13px 0", borderRadius: 12, background: "var(--wood)", color: "#fff", border: "none", fontSize: 14.5, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          <Icon name="printer" size={16} color="#fff" /> Informe del mes
        </button>
        <button className="rd-btn rd-anim" onClick={() => setInforme("trimestre")} style={{ flex: 1, padding: "13px 0", borderRadius: 12, background: "#fff", color: "var(--ink)", border: "1.5px solid var(--ink)", fontSize: 14.5, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          <Icon name="receipt" size={16} color="var(--ink)" /> Trimestral
        </button>
      </div>

      <div className="rd-card" style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 16, padding: "16px", marginBottom: 20 }}>
        <div className="rd-display" style={{ fontSize: 15, fontWeight: 600, color: "var(--muted)", marginBottom: 12 }}>Tendencia — últimos 6 meses</div>
        <TrendChart entries={entries} />
      </div>

      <div style={{ marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
        <div className="rd-display" style={{ fontSize: 16.5, fontWeight: 600, color: "var(--muted)" }}>
          {visibleEntries.length} {visibleEntries.length === 1 ? "movimiento" : "movimientos"}
          {filtroTipo ? ` · ${TIPOS[filtroTipo].label}s` : ""}
        </div>
        {filtroTipo && (
          <button className="rd-btn" onClick={() => setFiltroTipo(null)} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 13, color: "var(--muted)", fontWeight: 600 }}>
            <Icon name="x" size={13} /> Ver todos
          </button>
        )}
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "var(--clay)", padding: "10px 14px", borderRadius: 10, fontSize: 13, marginBottom: 12 }}>{error}</div>}

      {loading ? (
        <div style={{ color: "var(--muted)", fontSize: 14, padding: "24px 0", textAlign: "center" }}>Cargando registros…</div>
      ) : visibleEntries.length === 0 ? (
        <div style={{ border: "1px dashed var(--paper-line)", borderRadius: 14, padding: "32px 16px", textAlign: "center", color: "var(--muted)" }}>
          <Icon name="receipt" size={22} color="var(--muted)" style={{ marginBottom: 8, opacity: 0.6 }} />
          <div style={{ fontSize: 14 }}>Sin movimientos {filtroTipo ? `de ${TIPOS[filtroTipo].label.toLowerCase()}s` : ""} este mes.</div>
          <div style={{ fontSize: 13 }}>Ve a la pestaña "Registro" para agregar uno.</div>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {visibleEntries.map((e) => {
            const meta = TIPOS[e.tipo];
            return (
              <div key={e.id} onClick={() => openEditForm(e)} role="button" tabIndex={0} className="rd-card" style={{ display: "flex", alignItems: "center", gap: 12, background: "#fff", border: "1px solid var(--paper-line)", borderLeft: `4px solid ${meta.color}`, borderRadius: 12, padding: "12px 14px", cursor: "pointer" }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 2 }}>
                    <span style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: meta.color }}>{meta.label}</span>
                    {e.categoria && <span style={{ fontSize: 12.5, color: "var(--muted)" }}>· {e.categoria}</span>}
                  </div>
                  <div style={{ fontSize: 15.5, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.descripcion || e.persona || "Sin descripción"}</div>
                  <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>
                    {new Date(e.fecha + "T00:00:00").toLocaleDateString("es-CR", { day: "2-digit", month: "short" })}
                    {e.persona && e.descripcion ? ` · ${e.persona}` : ""}
                    {e.metodoPago ? ` · ${METODOS_PAGO.find((mp) => mp.key === e.metodoPago)?.label || e.metodoPago}` : ""}
                    {e.creadoPor ? ` · ${e.creadoPor.split("@")[0]}` : ""}
                  </div>
                </div>
                <div className="rd-mono" style={{ fontSize: 16.5, fontWeight: 600, color: meta.sign > 0 ? "var(--sage)" : "var(--clay)", whiteSpace: "nowrap" }}>
                  {meta.sign > 0 ? "+" : "−"}{currency(e.monto).replace("−", "").replace("-", "")}
                </div>
                <button className="rd-btn" onClick={(ev) => { ev.stopPropagation(); handleDelete(e.id); }} aria-label="Eliminar movimiento" style={{ color: "var(--muted)", padding: 4, display: "flex" }}>
                  <Icon name="trash" size={15} />
                </button>
              </div>
            );
          })}
        </div>
      )}

      {showForm && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(43,36,32,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }} onClick={closeForm}>
          <form onSubmit={handleSave} onClick={(e) => e.stopPropagation()} style={{ background: "var(--paper)", borderRadius: "20px 20px 0 0", padding: "20px 20px 28px", width: "100%", maxWidth: 480, maxHeight: "88vh", overflowY: "auto", boxSizing: "border-box" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div className="rd-display" style={{ fontSize: 20, fontWeight: 600 }}>Editar movimiento</div>
              <button className="rd-btn" type="button" onClick={closeForm} style={{ color: "var(--muted)" }}>
                <Icon name="x" size={20} />
              </button>
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              {Object.entries(TIPOS).map(([key, meta]) => (
                <button key={key} type="button" className="rd-btn" onClick={() => setForm((f) => ({ ...f, tipo: key, categoria: "" }))} style={{ flex: 1, padding: "10px 0", borderRadius: 10, fontSize: 14.5, fontWeight: 600, background: form.tipo === key ? meta.color : "#fff", color: form.tipo === key ? "#fff" : "var(--ink)", border: `1px solid ${form.tipo === key ? meta.color : "var(--paper-line)"}` }}>
                  {meta.label}
                </button>
              ))}
            </div>

            <Field label="Fecha">
              <CalendarPicker value={form.fecha} maxDate={todayStr()} onChange={(v) => setForm((f) => ({ ...f, fecha: v }))} />
            </Field>

            <Field label="Monto (₡)">
              <input className="rd-input rd-mono" type="number" inputMode="decimal" min="1" step="1" placeholder="0" value={form.monto} onChange={(e) => setForm((f) => ({ ...f, monto: e.target.value }))} required style={inputStyle} />
            </Field>

            {form.tipo === "salida" && (
              <Field label="Categoría">
                <SearchCreatePicker
                  value={form.categoria}
                  options={categories}
                  onChange={(v) => setForm((f) => ({ ...f, categoria: v }))}
                  onCreate={handleCreateCategory}
                  placeholder="Escribe para buscar o agregar…"
                  emptyText="Aún no hay categorías cargadas."
                  createLabel="Agregar categoría"
                />
              </Field>
            )}

            <Field label="Método de pago">
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {METODOS_PAGO.map((mp) => (
                  <button key={mp.key} type="button" className="rd-btn" onClick={() => setForm((f) => ({ ...f, metodoPago: mp.key }))} style={{ flex: "1 0 auto", padding: "9px 14px", borderRadius: 999, fontSize: 14, fontWeight: 600, background: form.metodoPago === mp.key ? "var(--ink)" : "#fff", color: form.metodoPago === mp.key ? "var(--paper)" : "var(--muted)", border: `1px solid ${form.metodoPago === mp.key ? "var(--ink)" : "var(--paper-line)"}` }}>
                    {mp.label}
                  </button>
                ))}
              </div>
            </Field>

            <Field label={form.tipo === "salida" ? "¿A quién se le pagó / persona responsable? (opcional)" : "¿De quién es? (opcional)"}>
              <SearchCreatePicker
                value={form.persona}
                options={members}
                onChange={(v) => setForm((f) => ({ ...f, persona: v }))}
                onCreate={handleCreateMember}
                placeholder="Escribe para buscar o agregar…"
                emptyText="Aún no hay miembros ni familias cargados."
                createLabel="Agregar miembro"
              />
            </Field>

            <Field label="Descripción (opcional)">
              <input className="rd-input" type="text" placeholder="Notas adicionales" value={form.descripcion} onChange={(e) => setForm((f) => ({ ...f, descripcion: e.target.value }))} style={inputStyle} />
            </Field>

            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button className="rd-btn" type="button" onClick={() => { handleDelete(editingId); closeForm(); }} style={{ padding: "13px 18px", borderRadius: 10, background: "#FBEAE5", color: "var(--clay)", fontSize: 15, fontWeight: 600 }}>
                <Icon name="trash" size={16} color="var(--clay)" />
              </button>
              <button className="rd-btn" type="submit" style={{ flex: 1, padding: "13px 0", borderRadius: 10, background: "var(--ink)", color: "var(--paper)", fontSize: 16, fontWeight: 600 }}>
                Guardar cambios
              </button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

// ============ REGISTRO (pantalla dedicada solo a registrar) ============
// ============ TABLA RAPIDA (varias filas seguidas, tipo hoja de cálculo) ============
function TablaRapida({ user, members, categories, handleCreateMember, handleCreateCategory }) {
  const [fecha, setFecha] = useState(todayStr());
  const [tipo, setTipo] = useState("diezmo");
  const [metodoPago, setMetodoPago] = useState("efectivo");
  const [filas, setFilas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [persona, setPersona] = useState("");
  const [monto, setMonto] = useState("");
  const [categoria, setCategoria] = useState("");

  useEffect(() => {
    setLoading(true);
    const unsub = db.collection("entries")
      .where("fecha", "==", fecha)
      .where("tipo", "==", tipo)
      .onSnapshot(
        (snap) => {
          const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          rows.sort((a, b) => ((a.creado && a.creado.seconds) || 0) - ((b.creado && b.creado.seconds) || 0));
          setFilas(rows);
          setLoading(false);
        },
        () => { setError("No se pudo cargar la lista de ese día."); setLoading(false); }
      );
    return () => unsub();
  }, [fecha, tipo]);

  const total = useMemo(() => filas.reduce((s, f) => s + (f.monto || 0), 0), [filas]);
  const cols = tipo === "salida" ? "28px 1fr 1fr 110px 32px" : "28px 1fr 110px 32px";

  async function agregarFila(e) {
    e.preventDefault();
    const m = Number(monto);
    if (!m || m <= 0) return;
    try {
      await db.collection("entries").add({
        fecha, tipo, monto: m, descripcion: "", persona: persona.trim(),
        categoria: tipo === "salida" ? categoria : "",
        metodoPago,
        creadoPor: user.email,
        creado: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setPersona("");
      setMonto("");
      setCategoria("");
      setError(null);
    } catch (err) {
      setError("No se pudo guardar la fila. Intenta de nuevo.");
    }
  }

  async function eliminarFila(id) {
    try { await db.collection("entries").doc(id).delete(); } catch (err) { setError("No se pudo eliminar la fila."); }
  }

  return (
    <div>
      <div className="rd-card" style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 16, padding: 16, marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          {Object.entries(TIPOS).map(([key, meta]) => (
            <button key={key} type="button" className="rd-btn" onClick={() => setTipo(key)} style={{ flex: 1, padding: "9px 0", borderRadius: 10, fontSize: 13.5, fontWeight: 600, background: tipo === key ? meta.color : "#fff", color: tipo === key ? "#fff" : "var(--ink)", border: `1px solid ${tipo === key ? meta.color : "var(--paper-line)"}` }}>
              {meta.label}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 180px" }}>
            <Field label="Fecha (aplica a todas las filas)">
              <CalendarPicker value={fecha} maxDate={todayStr()} onChange={setFecha} />
            </Field>
          </div>
          <div style={{ flex: "1 1 180px" }}>
            <Field label="Método de pago">
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {METODOS_PAGO.map((mp) => (
                  <button key={mp.key} type="button" className="rd-btn" onClick={() => setMetodoPago(mp.key)} style={{ padding: "7px 11px", borderRadius: 999, fontSize: 12.5, fontWeight: 600, background: metodoPago === mp.key ? "var(--ink)" : "#fff", color: metodoPago === mp.key ? "var(--paper)" : "var(--muted)", border: `1px solid ${metodoPago === mp.key ? "var(--ink)" : "var(--paper-line)"}` }}>
                    {mp.label}
                  </button>
                ))}
              </div>
            </Field>
          </div>
        </div>
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "var(--clay)", padding: "10px 14px", borderRadius: 10, fontSize: 13, marginBottom: 12 }}>{error}</div>}

      <div className="rd-card" style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 16, overflow: "hidden" }}>
        <div style={{ display: "grid", gridTemplateColumns: cols, gap: 8, padding: "8px 12px", background: "#FAF6F0", borderBottom: "1px solid var(--paper-line)", fontSize: 11, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.04em" }}>
          <div>#</div>
          <div>{tipo === "salida" ? "A quién / para qué" : "Persona"}</div>
          {tipo === "salida" && <div>Categoría</div>}
          <div style={{ textAlign: "right" }}>Monto</div>
          <div></div>
        </div>

        {loading ? (
          <div style={{ padding: 16, textAlign: "center", color: "var(--muted)", fontSize: 14 }}>Cargando…</div>
        ) : (
          filas.map((f, i) => (
            <div key={f.id} style={{ display: "grid", gridTemplateColumns: cols, gap: 8, padding: "9px 12px", borderBottom: "1px solid var(--paper-line)", alignItems: "center", fontSize: 14.5 }}>
              <div className="rd-mono" style={{ color: "var(--muted)", fontSize: 13 }}>{i + 1}</div>
              <div style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.persona || "—"}</div>
              {tipo === "salida" && <div style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: "var(--muted)" }}>{f.categoria || "—"}</div>}
              <div className="rd-mono" style={{ textAlign: "right", fontWeight: 600 }}>{currency(f.monto)}</div>
              <button type="button" className="rd-btn" onClick={() => eliminarFila(f.id)} aria-label="Eliminar fila" style={{ color: "var(--muted)", display: "flex", justifyContent: "center" }}>
                <Icon name="trash" size={14} />
              </button>
            </div>
          ))
        )}

        <form onSubmit={agregarFila} style={{ display: "grid", gridTemplateColumns: cols, gap: 8, padding: "9px 12px", alignItems: "center", background: "#FBF8F3" }}>
          <div className="rd-mono" style={{ color: "var(--muted)", fontSize: 13 }}>{filas.length + 1}</div>
          <div>
            <SearchCreatePicker
              value={persona}
              options={members}
              onChange={setPersona}
              onCreate={handleCreateMember}
              placeholder="Nombre…"
              emptyText="Aún no hay miembros ni familias cargados."
              createLabel="Agregar miembro"
            />
          </div>
          {tipo === "salida" && (
            <div>
              <SearchCreatePicker
                value={categoria}
                options={categories}
                onChange={setCategoria}
                onCreate={handleCreateCategory}
                placeholder="Categoría…"
                emptyText="Aún no hay categorías cargadas."
                createLabel="Agregar categoría"
              />
            </div>
          )}
          <input className="rd-input rd-mono" type="number" inputMode="decimal" min="1" step="1" placeholder="0" value={monto} onChange={(e) => setMonto(e.target.value)} style={{ ...inputStyle, padding: "8px 10px", textAlign: "right" }} />
          <button type="submit" className="rd-btn" aria-label="Agregar fila" style={{ width: 28, height: 28, borderRadius: 8, background: "var(--ink)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name="plus" size={14} color="#fff" />
          </button>
        </form>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 4px 0" }}>
        <div style={{ fontSize: 14, color: "var(--muted)", fontWeight: 600 }}>{filas.length} {filas.length === 1 ? "fila" : "filas"}</div>
        <div className="rd-mono" style={{ fontSize: 18, fontWeight: 700 }}>Total: {currency(total)}</div>
      </div>
    </div>
  );
}

function RegistroPage({ user }) {
  const [members, setMembers] = useState([]);
  const [categories, setCategories] = useState([]);
  const [error, setError] = useState(null);
  const [savedFlash, setSavedFlash] = useState(false);
  const [modo, setModo] = useState("uno");
  const montoRef = useRef(null);

  const [form, setForm] = useState({ fecha: "", tipo: "diezmo", monto: "", descripcion: "", persona: "", categoria: "", metodoPago: "efectivo" });

  useEffect(() => {
    const unsub = db.collection("members").orderBy("nombre").onSnapshot((snap) => setMembers(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return () => unsub();
  }, []);

  useEffect(() => {
    const unsub = db.collection("categories").orderBy("nombre").onSnapshot((snap) => setCategories(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return () => unsub();
  }, []);

  async function handleCreateMember(nombre) {
    const trimmed = nombre.trim();
    if (!trimmed) return;
    const yaExiste = members.some((m) => m.nombre.trim().toLowerCase() === trimmed.toLowerCase());
    if (yaExiste) return;
    try { await db.collection("members").add({ nombre: trimmed }); } catch (err) {}
  }

  async function handleCreateCategory(nombre) {
    const trimmed = nombre.trim();
    if (!trimmed) return;
    const yaExiste = categories.some((c) => c.nombre.trim().toLowerCase() === trimmed.toLowerCase());
    if (yaExiste) return;
    try { await db.collection("categories").add({ nombre: trimmed, grupo: GRUPO_SIN_ASIGNAR }); } catch (err) {}
  }

  async function handleSave(e) {
    e.preventDefault();
    if (!form.fecha || !form.monto || Number(form.monto) <= 0) return;
    const payload = {
      fecha: form.fecha, tipo: form.tipo, monto: Number(form.monto),
      descripcion: form.descripcion.trim(), persona: form.persona.trim(),
      categoria: form.tipo === "salida" ? form.categoria : "",
      metodoPago: form.metodoPago,
    };
    try {
      await db.collection("entries").add({
        ...payload,
        creadoPor: user.email,
        creado: firebase.firestore.FieldValue.serverTimestamp(),
      });
      // Deja la fecha, el tipo, la categoría y el método de pago igual para poder
      // seguir agregando movimientos rápido (por ejemplo varios diezmos del mismo domingo).
      setForm((f) => ({ ...f, monto: "", descripcion: "", persona: "" }));
      setSavedFlash(true);
      setTimeout(() => setSavedFlash(false), 1300);
      if (montoRef.current) montoRef.current.focus();
      setError(null);
    } catch (err) {
      setError("No se pudo guardar el movimiento. Intenta de nuevo.");
    }
  }

  return (
    <div>
      <h1 className="rd-display" style={{ margin: "0 0 4px", fontSize: 26, fontWeight: 600, color: "var(--ink)" }}>Registrar movimiento</h1>
      <div style={{ fontSize: 14.5, color: "var(--muted)", marginBottom: 16 }}>Agrega un diezmo, ofrenda o salida.</div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <TabButton active={modo === "uno"} onClick={() => setModo("uno")} iconName="receipt" label="Uno por uno" />
        <TabButton active={modo === "tabla"} onClick={() => setModo("tabla")} iconName="bars" label="Varios rápido (tabla)" />
      </div>

      {modo === "tabla" ? (
        <TablaRapida user={user} members={members} categories={categories} handleCreateMember={handleCreateMember} handleCreateCategory={handleCreateCategory} />
      ) : (
      <React.Fragment>
      {savedFlash && (
        <div style={{ background: "#EAF2EC", color: "var(--sage)", padding: "9px 14px", borderRadius: 10, fontSize: 14, fontWeight: 600, marginBottom: 14, display: "flex", alignItems: "center", gap: 8 }}>
          <Icon name="trendUp" size={15} color="var(--sage)" /> Guardado — puedes agregar el siguiente
        </div>
      )}
      {error && <div style={{ background: "#FBEAE5", color: "var(--clay)", padding: "10px 14px", borderRadius: 10, fontSize: 13, marginBottom: 14 }}>{error}</div>}

      <form onSubmit={handleSave} className="rd-card" style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 16, padding: 16 }}>
        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          {Object.entries(TIPOS).map(([key, meta]) => (
            <button key={key} type="button" className="rd-btn" onClick={() => setForm((f) => ({ ...f, tipo: key, categoria: "" }))} style={{ flex: 1, padding: "10px 0", borderRadius: 10, fontSize: 14.5, fontWeight: 600, background: form.tipo === key ? meta.color : "#fff", color: form.tipo === key ? "#fff" : "var(--ink)", border: `1px solid ${form.tipo === key ? meta.color : "var(--paper-line)"}` }}>
              {meta.label}
            </button>
          ))}
        </div>

        <Field label="Fecha">
          <CalendarPicker value={form.fecha} maxDate={todayStr()} onChange={(v) => setForm((f) => ({ ...f, fecha: v }))} />
        </Field>

        <Field label="Monto (₡)">
          <input ref={montoRef} className="rd-input rd-mono" type="number" inputMode="decimal" min="1" step="1" placeholder="0" value={form.monto} onChange={(e) => setForm((f) => ({ ...f, monto: e.target.value }))} required style={inputStyle} />
        </Field>

        {form.tipo === "salida" && (
          <Field label="Categoría">
            <SearchCreatePicker
              value={form.categoria}
              options={categories}
              onChange={(v) => setForm((f) => ({ ...f, categoria: v }))}
              onCreate={handleCreateCategory}
              placeholder="Escribe para buscar o agregar…"
              emptyText="Aún no hay categorías cargadas."
              createLabel="Agregar categoría"
            />
          </Field>
        )}

        <Field label="Método de pago">
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {METODOS_PAGO.map((mp) => (
              <button key={mp.key} type="button" className="rd-btn" onClick={() => setForm((f) => ({ ...f, metodoPago: mp.key }))} style={{ flex: "1 0 auto", padding: "9px 14px", borderRadius: 999, fontSize: 14, fontWeight: 600, background: form.metodoPago === mp.key ? "var(--ink)" : "#fff", color: form.metodoPago === mp.key ? "var(--paper)" : "var(--muted)", border: `1px solid ${form.metodoPago === mp.key ? "var(--ink)" : "var(--paper-line)"}` }}>
                {mp.label}
              </button>
            ))}
          </div>
        </Field>

        <Field label={form.tipo === "salida" ? "¿A quién se le pagó / persona responsable? (opcional)" : "¿De quién es? (opcional)"}>
          <SearchCreatePicker
            value={form.persona}
            options={members}
            onChange={(v) => setForm((f) => ({ ...f, persona: v }))}
            onCreate={handleCreateMember}
            placeholder="Escribe para buscar o agregar…"
            emptyText="Aún no hay miembros ni familias cargados."
            createLabel="Agregar miembro"
          />
        </Field>

        <Field label="Descripción (opcional)">
          <input className="rd-input" type="text" placeholder="Notas adicionales" value={form.descripcion} onChange={(e) => setForm((f) => ({ ...f, descripcion: e.target.value }))} style={inputStyle} />
        </Field>

        <button className="rd-btn" type="submit" style={{ width: "100%", marginTop: 8, padding: "14px 0", borderRadius: 10, background: "var(--ink)", color: "var(--paper)", fontSize: 16, fontWeight: 600 }}>
          Guardar movimiento
        </button>
      </form>
      </React.Fragment>
      )}
    </div>
  );
}

// ============ SHELL (nav inferior + logout) ============
function NavButton({ active, onClick, iconName, label }) {
  return (
    <button className="rd-btn" onClick={onClick} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "6px 0", borderRadius: 10, color: active ? "var(--ink)" : "var(--muted)" }}>
      <Icon name={iconName} size={19} />
      <span style={{ fontSize: 12.5, fontWeight: 600 }}>{label}</span>
    </button>
  );
}

      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 20 }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, color: "var(--muted)", fontSize: 13.5, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 4 }}>
            <Icon name="wallet" size={14} />
            <span>Libro de Tesorería</span>
          </div>
          <div style={{ fontSize: 13.5, color: "var(--muted)" }}>{user.email}</div>
        </div>
        <button className="rd-btn no-print" onClick={() => auth.signOut()} aria-label="Cerrar sesión" style={{ color: "var(--muted)", padding: 6, display: "flex" }}>

      <div className="no-print" style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#fff", borderTop: "1px solid var(--paper-line)", display: "flex", padding: "8px 12px calc(8px + env(safe-area-inset-bottom))", gap: 4, zIndex: 40 }}>

// ============ VISTA SIMPLE DEL PASTOR ============
function PastorView({ user }) {
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [monthOffset, setMonthOffset] = useState(0);
  const [informe, setInforme] = useState(null); // null | "mes" | "trimestre"

  useEffect(() => {
    const unsub = db.collection("entries").onSnapshot(
      (snap) => { setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); },
      () => setLoading(false)
    );
    return () => unsub();
  }, []);

  const viewKey = useMemo(() => {
    const d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() + monthOffset);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  }, [monthOffset]);

  const monthEntries = useMemo(() => entries.filter((e) => monthKey(e.fecha) === viewKey), [entries, viewKey]);

  const totals = useMemo(() => {
    let diezmos = 0, ofrendas = 0, salidas = 0;
    for (const e of monthEntries) {
      if (e.tipo === "diezmo") diezmos += e.monto;
      else if (e.tipo === "ofrenda") ofrendas += e.monto;
      else if (e.tipo === "salida") salidas += e.monto;
    }
    return { diezmos, ofrendas, salidas, balance: diezmos + ofrendas - salidas };
  }, [monthEntries]);

  if (informe) {
    return (
      <div className="app-shell" style={{ ...theme, fontFamily: "'Public Sans', system-ui, sans-serif", background: "var(--paper)", color: "var(--ink)", minHeight: "100vh", width: "100%", boxSizing: "border-box", padding: "20px 16px 40px" }}>
        <button className="rd-btn no-print" onClick={() => setInforme(null)} style={{ display: "flex", alignItems: "center", gap: 6, color: "var(--muted)", fontWeight: 600, fontSize: 14.5, marginBottom: 16 }}>
          <Icon name="chevron" size={16} style={{ transform: "rotate(90deg)" }} /> Volver
        </button>
        {informe === "mes" ? <EstadoResultados /> : <InformeTrimestral />}
      </div>
    );
  }

  const stats = [
    { key: "diezmo", label: "Diezmos", value: totals.diezmos, color: "var(--wood)", bg: "#F3E9DD", icon: "handCoins" },
    { key: "ofrenda", label: "Ofrendas", value: totals.ofrendas, color: "var(--gold)", bg: "#FBF3D9", icon: "trendUp" },
    { key: "salida", label: "Gastos", value: totals.salidas, color: "var(--clay)", bg: "#F7E5DF", icon: "trendDown" },
  ];

  return (
    <div className="app-shell" style={{ ...theme, fontFamily: "'Public Sans', system-ui, sans-serif", background: "var(--paper)", color: "var(--ink)", minHeight: "100vh", width: "100%", boxSizing: "border-box", display: "flex", flexDirection: "column" }}>
      <div style={{ padding: "22px 22px 0" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontSize: 13, color: "var(--muted)", letterSpacing: "0.06em", textTransform: "uppercase", fontWeight: 700 }}>Iglesia · Tesorería</div>
            <div className="rd-display" style={{ fontSize: 26, fontWeight: 600, marginTop: 2 }}>Resumen del mes</div>
          </div>
          <button className="rd-btn no-print" onClick={() => auth.signOut()} aria-label="Cerrar sesión" style={{ width: 44, height: 44, borderRadius: 12, background: "#fff", border: "1px solid var(--paper-line)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name="logout" size={20} color="var(--muted)" />
          </button>
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "22px 18px 4px" }}>
        <button className="rd-btn" onClick={() => setMonthOffset((o) => o - 1)} aria-label="Mes anterior" style={{ width: 48, height: 48, borderRadius: 14, border: "1px solid var(--paper-line)", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="chevron" size={18} style={{ transform: "rotate(90deg)" }} />
        </button>
        <div className="rd-display" style={{ fontSize: 21, fontWeight: 600 }}>{monthLabel(viewKey)}</div>
        <button className="rd-btn" onClick={() => setMonthOffset((o) => Math.min(0, o + 1))} disabled={monthOffset >= 0} aria-label="Mes siguiente" style={{ width: 48, height: 48, borderRadius: 14, border: "1px solid var(--paper-line)", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", opacity: monthOffset >= 0 ? 0.35 : 1 }}>
          <Icon name="chevron" size={18} style={{ transform: "rotate(-90deg)" }} />
        </button>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "14px 18px 28px", display: "flex", flexDirection: "column", gap: 12 }}>
        {loading ? (
          <div style={{ textAlign: "center", color: "var(--muted)", padding: "24px 0" }}>Cargando…</div>
        ) : (
          <React.Fragment>
            {stats.map((s) => (
              <div key={s.key} className="rd-card" style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 18, padding: "18px 20px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ width: 46, height: 46, borderRadius: 13, background: s.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <Icon name={s.icon} size={22} color={s.color} />
                  </div>
                  <div style={{ fontSize: 17, fontWeight: 700, color: s.color }}>{s.label}</div>
                </div>
                <div className="rd-mono" style={{ fontSize: 22, fontWeight: 600 }}>{currency(s.value)}</div>
              </div>
            ))}

            <div className="rd-card-dark" style={{ background: "var(--ink)", borderRadius: 18, padding: 20, marginTop: 4 }}>
              <div style={{ color: "rgba(250,246,240,0.65)", fontSize: 14, fontWeight: 700, marginBottom: 8 }}>Queda disponible</div>
              <div className="rd-mono" style={{ color: "var(--paper)", fontSize: 30, fontWeight: 600 }}>{currency(totals.balance)}</div>
            </div>

            <button className="rd-btn rd-anim" onClick={() => setInforme("mes")} style={{ marginTop: 10, width: "100%", padding: "17px 0", borderRadius: 16, background: "var(--wood)", color: "var(--paper)", border: "none", fontSize: 17, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
              <Icon name="printer" size={20} color="var(--paper)" /> Ver informe del mes (PDF)
            </button>

            <button className="rd-btn rd-anim" onClick={() => setInforme("trimestre")} style={{ width: "100%", padding: "17px 0", borderRadius: 16, background: "#fff", color: "var(--ink)", border: "1.5px solid var(--ink)", fontSize: 17, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
              <Icon name="receipt" size={20} color="var(--ink)" /> Ver informe trimestral
            </button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// ============ APP RAIZ ============
function App() {
  const [user, setUser] = useState(undefined);
  const [rol, setRol] = useState(null);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => setUser(u));
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!user) { setRol(null); return; }
    const email = user.email.trim().toLowerCase();
    const unsub = db.collection("usuarios").doc(email).onSnapshot(
      (doc) => setRol(doc.exists ? (doc.data().rol || "tesorero") : "tesorero"),
      () => setRol("tesorero")
    );
    return () => unsub();
  }, [user]);

  if (user === undefined) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#FAF6F0", color: "#8A7F6E", fontFamily: "system-ui" }}>Cargando…</div>;
  }
  if (!user) return <Login />;
  if (rol === null) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#FAF6F0", color: "#8A7F6E", fontFamily: "system-ui" }}>Cargando…</div>;
  }
  if (rol === "pastor") return <PastorView user={user} />;
  return <Shell user={user} rol={rol} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
