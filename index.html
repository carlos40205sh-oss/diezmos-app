const PORCENTAJE_REMESA = 0.10;

function TrendChart({ entries }) {
  const monthsData = useMemo(() => {
    const hoy = todayStr();
    const claves = [];
    const base = new Date(hoy + "T00:00:00");
    for (let i = 5; i >= 0; i--) {
      const d = new Date(base.getFullYear(), base.getMonth() - i, 1);
      claves.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
    }
    return claves.map((mKey) => {
      const del = entries.filter((e) => monthKey(e.fecha) === mKey);
      const diezmos = del.filter((e) => e.tipo === "diezmo").reduce((s, e) => s + e.monto, 0);
      const ofrendas = del.filter((e) => e.tipo === "ofrenda").reduce((s, e) => s + e.monto, 0);
      const salidas = del.filter((e) => e.tipo === "salida").reduce((s, e) => s + e.monto, 0);
      return { mKey, diezmos, ofrendas, salidas };
    });
  }, [entries]);

  const maxVal = Math.max(1, ...monthsData.flatMap((m) => [m.diezmos, m.ofrendas, m.salidas]));
  const chartH = 110;
  const barW = 11;
  const gapBar = 4;
  const groupW = barW * 3 + gapBar * 2;
  const groupGap = 20;
  const svgW = monthsData.length * (groupW + groupGap);

  function h(v) {
    return maxVal > 0 ? Math.max(v > 0 ? 2 : 0, (v / maxVal) * chartH) : 0;
  }

  const hayDatos = monthsData.some((m) => m.diezmos || m.ofrendas || m.salidas);

  return (
    <div>
      <div style={{ display: "flex", gap: 16, marginBottom: 12, flexWrap: "wrap" }}>
        {[["#8B5E3C", "Diezmos"], ["#C9A227", "Ofrendas"], ["#B5533C", "Gastos"]].map(([c, l]) => (
          <div key={l} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "var(--muted)" }}>
            <span style={{ width: 9, height: 9, borderRadius: 3, background: c, display: "inline-block" }} />
            {l}
          </div>
        ))}
      </div>
      {!hayDatos ? (
        <div style={{ fontSize: 13.5, color: "var(--muted)", padding: "12px 0" }}>Aún no hay suficientes movimientos para mostrar una tendencia.</div>
      ) : (
        <div className="rd-scroll" style={{ overflowX: "auto" }}>
          <svg width={Math.max(svgW, 260)} height={chartH + 30} style={{ display: "block" }}>
            <line x1="0" y1={chartH} x2={Math.max(svgW, 260)} y2={chartH} stroke="#E7DFD2" strokeWidth="1" />
            {monthsData.map((m, i) => {
              const x0 = i * (groupW + groupGap);
              return (
                <g key={m.mKey}>
                  <rect x={x0} y={chartH - h(m.diezmos)} width={barW} height={h(m.diezmos)} rx={2} fill="#8B5E3C" />
                  <rect x={x0 + barW + gapBar} y={chartH - h(m.ofrendas)} width={barW} height={h(m.ofrendas)} rx={2} fill="#C9A227" />
                  <rect x={x0 + (barW + gapBar) * 2} y={chartH - h(m.salidas)} width={barW} height={h(m.salidas)} rx={2} fill="#B5533C" />
                  <text x={x0 + groupW / 2} y={chartH + 18} textAnchor="middle" fontSize="10.5" fill="#8A7F6E" fontFamily="'Public Sans', sans-serif">
                    {monthLabel(m.mKey).slice(0, 3)}
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      )}
    </div>
  );
}

function currency(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("es-CR", { style: "currency", currency: "CRC", maximumFractionDigits: 0 });
}

function monthKey(dateStr) {
  return dateStr ? dateStr.slice(0, 7) : "";
}

function monthLabel(key) {
  if (!key) return "";
  const [y, m] = key.split("-");
  const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
  return `${meses[parseInt(m, 10) - 1]} ${y}`;
}

function dateLabel(dateStr) {
  if (!dateStr) return "";
  return new Date(dateStr + "T00:00:00").toLocaleDateString("es-CR", {
    weekday: "long", day: "2-digit", month: "long", year: "numeric",
  });
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

const MESES_ES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

function DateSelect({ value, onChange, maxDate }) {
  const [y, m, d] = value ? value.split("-") : ["", "", ""];
  const currentYear = new Date().getFullYear();
  const years = [];
  for (let yy = currentYear; yy >= currentYear - 4; yy--) years.push(yy);
  function daysInMonth(yy, mm) {
    if (!yy || !mm) return 31;
    return new Date(Number(yy), Number(mm), 0).getDate();
  }
  const maxDays = daysInMonth(y, m);
  const dayNum = d ? Number(d) : "";

  function build(newD, newM, newY) {
    if (newD && newM && newY) {
      const dd = String(newD).padStart(2, "0");
      const mm = String(newM).padStart(2, "0");
      let candidate = `${newY}-${mm}-${dd}`;
      if (maxDate && candidate > maxDate) candidate = maxDate;
      onChange(candidate);
    }
  }

  return (
    <div style={{ display: "flex", gap: 8 }}>
      <select className="rd-select" style={{ ...inputStyle, flex: 0.8 }} value={dayNum} onChange={(e) => build(e.target.value, m || String(new Date().getMonth() + 1), y || String(currentYear))}>
        <option value="">Día</option>
        {Array.from({ length: maxDays }, (_, i) => i + 1).map((day) => <option key={day} value={day}>{day}</option>)}
      </select>
      <select className="rd-select" style={{ ...inputStyle, flex: 1.6 }} value={m ? Number(m) : ""} onChange={(e) => build(d || "1", e.target.value, y || String(currentYear))}>
        <option value="">Mes</option>
        {MESES_ES.map((mes, i) => <option key={i} value={i + 1}>{mes}</option>)}
      </select>
      <select className="rd-select" style={{ ...inputStyle, flex: 1 }} value={y ? Number(y) : ""} onChange={(e) => build(d || "1", m || String(new Date().getMonth() + 1), e.target.value)}>
        <option value="">Año</option>
        {years.map((yy) => <option key={yy} value={yy}>{yy}</option>)}
      </select>
    </div>
  );
}

const METODOS_PAGO = [
  { key: "efectivo", label: "Efectivo" },
  { key: "sinpe", label: "SINPE" },

function SearchCreatePicker({ value, options, onChange, onCreate, placeholder, emptyText, createLabel }) {
  const [query, setQuery] = useState(value || "");
  const [open, setOpen] = useState(false);
  const [creating, setCreating] = useState(false);

  useEffect(() => { setQuery(value || ""); }, [value]);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return options;
    return options.filter((o) => o.nombre.toLowerCase().includes(q));
  }, [options, query]);

  const exactMatch = options.some((o) => o.nombre.trim().toLowerCase() === query.trim().toLowerCase());

  function selectOption(nombre) {
    setQuery(nombre);
    onChange(nombre);
    setOpen(false);
  }

  async function handleCreate() {
    const nombre = query.trim();
    if (!nombre || creating) return;
    setCreating(true);
    try {
      await onCreate(nombre);
    } finally {
      setCreating(false);
      selectOption(nombre);
    }
  }

  return (
    <div style={{ position: "relative" }}>
      <input
        className="rd-input"
        type="text"
        value={query}
        placeholder={placeholder}
        onChange={(e) => { setQuery(e.target.value); onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
        style={inputStyle}
      />
      {open && (
        <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 10, boxShadow: "0 8px 24px rgba(43,36,32,0.15)", maxHeight: 220, overflowY: "auto", zIndex: 60 }}>
          {options.length === 0 && (
            <div style={{ padding: "12px 14px", fontSize: 13.5, color: "var(--muted)" }}>{emptyText}</div>
          )}
          {filtered.map((o) => (
            <button key={o.id} type="button" className="rd-btn" onMouseDown={() => selectOption(o.nombre)} style={{ display: "block", width: "100%", textAlign: "left", padding: "10px 14px", fontSize: 15, borderBottom: "1px solid var(--paper-line)" }}>
              {o.nombre}
            </button>
          ))}
          {query.trim() && !exactMatch && (
            <button type="button" className="rd-btn" onMouseDown={handleCreate} disabled={creating} style={{ display: "flex", alignItems: "center", gap: 6, width: "100%", textAlign: "left", padding: "10px 14px", fontSize: 15, color: "var(--wood)", fontWeight: 600 }}>
              <Icon name="plus" size={14} color="var(--wood)" /> {createLabel || "Agregar"} "{query.trim()}"
            </button>
          )}
        </div>
      )}
    </div>
  );
}

// ============ LOGIN ============
function Login() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError(null);
    setLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), password);
    } catch (err) {
      if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found"].includes(err.code)) {
        setError("Correo o clave incorrectos.");
      } else {
        setError("No se pudo iniciar sesión. Intenta de nuevo.");
      }
    } finally {
      setLoading(false);
    }
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#FAF6F0", fontFamily: "'Public Sans', system-ui, sans-serif", padding: 20, boxSizing: "border-box" }}>
      <form onSubmit={handleSubmit} style={{ background: "#fff", border: "1px solid #E7DFD2", borderRadius: 16, padding: "32px 28px", width: "100%", maxWidth: 360, boxSizing: "border-box" }}>
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 12 }}>
          <div style={{ background: "#2B2420", borderRadius: "50%", width: 44, height: 44, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name="lock" size={18} color="#FAF6F0" />
          </div>
        </div>
        <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: 22, textAlign: "center", margin: "0 0 4px", color: "#2B2420" }}>Libro de Tesorería</h1>
        <p style={{ textAlign: "center", fontSize: 14.5, color: "#8A7F6E", margin: "0 0 24px" }}>Acceso solo para personal autorizado</p>

        <label style={{ display: "block", fontSize: 14, fontWeight: 600, color: "#8A7F6E", marginBottom: 6 }}>Correo</label>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required style={inputStyle} placeholder="correo@ejemplo.com" />

        <label style={{ display: "block", fontSize: 14, fontWeight: 600, color: "#8A7F6E", margin: "14px 0 6px" }}>Clave</label>
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required style={inputStyle} placeholder="••••••••" />

        {error && <div style={{ marginTop: 12, fontSize: 14.5, color: "#B5533C", background: "#FBEAE5", padding: "8px 12px", borderRadius: 8 }}>{error}</div>}

        <button type="submit" disabled={loading} style={{ width: "100%", marginTop: 20, padding: "12px 0", borderRadius: 10, background: "#2B2420", color: "#FAF6F0", border: "none", fontSize: 16, fontWeight: 600, cursor: loading ? "default" : "pointer", opacity: loading ? 0.7 : 1 }}>
          {loading ? "Ingresando…" : "Ingresar"}
        </button>
      </form>
    </div>
  );
}

function TabButton({ active, onClick, iconName, label }) {
  return (

function SimpleList({ collectionName, placeholder, emptyText }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [nombre, setNombre] = useState("");
  const [saving, setSaving] = useState(false);
  const [busqueda, setBusqueda] = useState("");

  useEffect(() => {
    const unsub = db.collection(collectionName).orderBy("nombre").onSnapshot(
      (snap) => { setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); },
      () => { setError("No se pudo cargar la lista."); setLoading(false); }
    );
    return () => unsub();
  }, [collectionName]);

  async function handleAdd(e) {
    e.preventDefault();
    const trimmed = nombre.trim();
    if (!trimmed) return;
    const yaExiste = items.some((it) => it.nombre.trim().toLowerCase() === trimmed.toLowerCase());
    if (yaExiste) {
      setError(`"${trimmed}" ya está en la lista.`);
      return;
    }
    setSaving(true);
    try {
      await db.collection(collectionName).add({ nombre: trimmed });
      setNombre("");
      setError(null);
    } catch (err) {
      setError("No se pudo guardar. Intenta de nuevo.");
    } finally {
      setSaving(false);
    }
  }

  async function handleDelete(id) {
    try {
      await db.collection(collectionName).doc(id).delete();
    } catch (err) {
      setError("No se pudo eliminar.");
    }
  }

  const filtrados = useMemo(() => {
    const q = busqueda.trim().toLowerCase();
    if (!q) return items;
    return items.filter((it) => it.nombre.toLowerCase().includes(q));
  }, [items, busqueda]);

  return (
    <div>
      <form onSubmit={handleAdd} style={{ display: "flex", gap: 8, marginBottom: 10 }}>
        <input className="rd-input" type="text" value={nombre} onChange={(e) => { setNombre(e.target.value); if (error) setError(null); }} placeholder={placeholder} style={{ ...inputStyle, flex: 1 }} />
        <button className="rd-btn" type="submit" disabled={saving} style={{ width: 44, borderRadius: 9, background: "var(--ink)", color: "var(--paper)", display: "flex", alignItems: "center", justifyContent: "center", opacity: saving ? 0.6 : 1 }} aria-label="Agregar">
          <Icon name="plus" size={18} />
        </button>
      </form>

      {items.length > 4 && (
        <input className="rd-input" type="text" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar en la lista…" style={{ ...inputStyle, marginBottom: 16 }} />
      )}

      {error && <div style={{ background: "#FBEAE5", color: "var(--clay)", padding: "10px 14px", borderRadius: 10, fontSize: 14.5, marginBottom: 12 }}>{error}</div>}

      {loading ? (
        <div style={{ color: "var(--muted)", fontSize: 15.5, textAlign: "center", padding: "16px 0" }}>Cargando…</div>
      ) : items.length === 0 ? (
        <div style={{ border: "1px dashed var(--paper-line)", borderRadius: 12, padding: "24px 16px", textAlign: "center", color: "var(--muted)", fontSize: 15 }}>{emptyText}</div>
      ) : filtrados.length === 0 ? (
        <div style={{ border: "1px dashed var(--paper-line)", borderRadius: 12, padding: "24px 16px", textAlign: "center", color: "var(--muted)", fontSize: 15 }}>Sin resultados para "{busqueda}".</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {filtrados.map((item) => (
            <div key={item.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 10, padding: "10px 14px" }}>
              <span style={{ fontSize: 15.5 }}>{item.nombre}</span>
              <button className="rd-btn" onClick={() => handleDelete(item.id)} aria-label="Eliminar" style={{ color: "var(--muted)", padding: 4, display: "flex" }}>
                <Icon name="trash" size={15} />
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function DailyReport() {
  const [fecha, setFecha] = useState(todayStr());
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    setLoading(true);
    const unsub = db.collection("entries").where("fecha", "==", fecha).onSnapshot(
      (snap) => { setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); setError(null); },
      () => { setError("No se pudo cargar el informe."); setLoading(false); }
    );
    return () => unsub();
  }, [fecha]);

  const totals = useMemo(() => {
    let diezmos = 0, ofrendas = 0, salidas = 0;
    for (const e of entries) {
      if (e.tipo === "diezmo") diezmos += e.monto;
      else if (e.tipo === "ofrenda") ofrendas += e.monto;
      else if (e.tipo === "salida") salidas += e.monto;
    }
    const remesa = diezmos * PORCENTAJE_REMESA;
    const ingresos = diezmos + ofrendas;
    return { diezmos, ofrendas, salidas, remesa, ingresos, disponibleLocal: ingresos - remesa - salidas };
  }, [entries]);

  const salidasPorCategoria = useMemo(() => {
    const map = {};
    for (const e of entries) {
      if (e.tipo === "salida") {
        const key = e.categoria || "Sin categoría";
        map[key] = (map[key] || 0) + e.monto;
      }
    }
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [entries]);

  return (
    <div>
      <h1 className="rd-display" style={{ margin: "0 0 16px", fontSize: 24, fontWeight: 600 }}>{dateLabel(fecha)}</h1>
      <PrintButton />
      <div className="no-print" style={{ marginBottom: 20 }}>
        <DateSelect value={fecha} maxDate={todayStr()} onChange={setFecha} />
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "var(--clay)", padding: "10px 14px", borderRadius: 10, fontSize: 14.5, marginBottom: 12 }}>{error}</div>}

      {loading ? (
        <div style={{ color: "var(--muted)", fontSize: 15.5, textAlign: "center", padding: "24px 0" }}>Cargando…</div>
      ) : entries.length === 0 ? (
        <div style={{ border: "1px dashed var(--paper-line)", borderRadius: 14, padding: "32px 16px", textAlign: "center", color: "var(--muted)", fontSize: 15 }}>Sin movimientos registrados en esta fecha.</div>
      ) : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
            <SummaryCard iconName="handCoins" label="Diezmos" value={totals.diezmos} color="var(--wood)" />
            <SummaryCard iconName="trendUp" label="Ofrendas" value={totals.ofrendas} color="var(--gold)" />
            <SummaryCard iconName="trendDown" label="Salidas" value={totals.salidas} color="var(--clay)" />
            <SummaryCard iconName="trendUp" label="Total entradas" value={totals.ingresos} color="var(--sage)" />
          </div>

          <div className="rd-card" style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 14, padding: "16px", marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
              <Icon name="landmark" size={16} color="var(--wood)" />
              <span style={{ fontSize: 14.5, fontWeight: 600, color: "var(--ink)" }}>Remesa a iglesia nacional (10% de diezmos)</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14.5, color: "var(--muted)", marginBottom: 6 }}><span>Diezmos del día</span><span className="rd-mono">{currency(totals.diezmos)}</span></div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14.5, color: "var(--muted)", marginBottom: 6 }}><span>× 10%</span><span className="rd-mono">{currency(totals.remesa)}</span></div>
            <div style={{ height: 1, background: "var(--paper-line)", margin: "8px 0" }} />
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 16, fontWeight: 700, color: "var(--wood)" }}><span>A remesar</span><span className="rd-mono">{currency(totals.remesa)}</span></div>
          </div>

          <div className="rd-card-dark" style={{ background: "var(--ink)", borderRadius: 14, padding: "16px", marginBottom: 20 }}>
            <div style={{ color: "rgba(250,246,240,0.65)", fontSize: 13.5, fontWeight: 600, marginBottom: 10 }}>Queda disponible para la iglesia local</div>
            <div style={{ fontSize: 13, color: "rgba(250,246,240,0.5)", marginBottom: 4 }}>(diezmos + ofrendas) − remesa 10% − salidas del día</div>
            <div className="rd-mono" style={{ color: "var(--paper)", fontSize: 23, fontWeight: 600, marginTop: 6 }}>{currency(totals.disponibleLocal)}</div>
          </div>

          {salidasPorCategoria.length > 0 && (
            <div style={{ marginBottom: 8 }}>
              <div className="rd-display" style={{ fontSize: 16, fontWeight: 600, color: "var(--muted)", marginBottom: 8 }}>Salidas por categoría</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {salidasPorCategoria.map(([cat, monto]) => (
                  <div key={cat} style={{ display: "flex", justifyContent: "space-between", background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 10, padding: "10px 14px", fontSize: 15 }}>
                    <span>{cat}</span><span className="rd-mono" style={{ color: "var(--clay)", fontWeight: 600 }}>{currency(monto)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div>
            <div className="rd-display" style={{ fontSize: 16, fontWeight: 600, color: "var(--muted)", margin: "16px 0 8px" }}>Movimientos del día ({entries.length})</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {entries.map((e) => {
                const meta = TIPOS[e.tipo];
                return (
                  <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 10, background: "#fff", border: "1px solid var(--paper-line)", borderLeft: `4px solid ${meta.color}`, borderRadius: 10, padding: "10px 14px" }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <span style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: meta.color }}>{meta.label}</span>
                      <div style={{ fontSize: 14.5, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.descripcion || e.persona || "Sin descripción"}</div>
                    </div>
                    <div className="rd-mono" style={{ fontSize: 15, fontWeight: 600, color: meta.sign > 0 ? "var(--sage)" : "var(--clay)" }}>
                      {meta.sign > 0 ? "+" : "−"}{currency(e.monto).replace("−", "").replace("-", "")}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function MemberMonthReport() {
  const [selectedMonth, setSelectedMonth] = useState(monthKey(todayStr()));
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    const unsub = db.collection("entries").where("tipo", "==", "diezmo").onSnapshot(
      (snap) => { setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); setError(null); },
      () => { setError("No se pudo cargar el informe."); setLoading(false); }
    );
    return () => unsub();
  }, []);

  const months = useMemo(() => {
    const set = new Set(entries.map((e) => monthKey(e.fecha)));
    set.add(monthKey(todayStr()));
    return Array.from(set).sort().reverse();
  }, [entries]);

  const monthEntries = useMemo(() => entries.filter((e) => monthKey(e.fecha) === selectedMonth), [entries, selectedMonth]);

  const porDiezmador = useMemo(() => {
    const map = {};
    for (const e of monthEntries) {
      const nombre = e.persona && e.persona.trim() ? e.persona.trim() : "Sin especificar";
      if (!map[nombre]) map[nombre] = { total: 0, cantidad: 0 };
      map[nombre].total += e.monto;
      map[nombre].cantidad += 1;
    }
    return Object.entries(map).map(([nombre, datos]) => ({ nombre, ...datos })).sort((a, b) => b.total - a.total);
  }, [monthEntries]);

  const totalMes = useMemo(() => monthEntries.reduce((s, e) => s + e.monto, 0), [monthEntries]);

  return (
    <div>
      <h1 className="rd-display" style={{ margin: "0 0 16px", fontSize: 24, fontWeight: 600 }}>Diezmos por persona — {monthLabel(selectedMonth)}</h1>
      <PrintButton />

      <div className="rd-scroll no-print" style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4, marginBottom: 20 }}>
        {months.map((m) => (
          <button key={m} className="rd-btn rd-anim" onClick={() => setSelectedMonth(m)} style={{ flexShrink: 0, padding: "9px 15px", borderRadius: 999, fontSize: 14.5, fontWeight: 600, background: m === selectedMonth ? "var(--ink)" : "transparent", color: m === selectedMonth ? "var(--paper)" : "var(--muted)", border: `1px solid ${m === selectedMonth ? "var(--ink)" : "var(--paper-line)"}` }}>
            {monthLabel(m)}
          </button>
        ))}
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "var(--clay)", padding: "10px 14px", borderRadius: 10, fontSize: 14.5, marginBottom: 12 }}>{error}</div>}

      {loading ? (
        <div style={{ color: "var(--muted)", fontSize: 15.5, textAlign: "center", padding: "24px 0" }}>Cargando…</div>
      ) : porDiezmador.length === 0 ? (
        <div style={{ border: "1px dashed var(--paper-line)", borderRadius: 14, padding: "32px 16px", textAlign: "center", color: "var(--muted)", fontSize: 15 }}>Sin diezmos registrados este mes.</div>
      ) : (
        <>
          <div className="rd-card-dark" style={{ background: "var(--ink)", borderRadius: 14, padding: "16px", marginBottom: 16 }}>
            <div style={{ color: "rgba(250,246,240,0.65)", fontSize: 13.5, fontWeight: 600, marginBottom: 8 }}>Total de diezmos del mes ({porDiezmador.reduce((s, p) => s + p.cantidad, 0)} movimientos)</div>
            <div className="rd-mono" style={{ color: "var(--paper)", fontSize: 22, fontWeight: 600 }}>{currency(totalMes)}</div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {porDiezmador.map((p) => (
              <div key={p.nombre} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 15.5, color: p.nombre === "Sin especificar" ? "var(--muted)" : "var(--ink)", fontStyle: p.nombre === "Sin especificar" ? "italic" : "normal" }}>{p.nombre}</div>
                  <div style={{ fontSize: 12.5, color: "var(--muted)", marginTop: 2 }}>{p.cantidad} {p.cantidad === 1 ? "movimiento" : "movimientos"}</div>
                </div>
                <div className="rd-mono" style={{ fontSize: 16, fontWeight: 600, color: "var(--wood)", whiteSpace: "nowrap" }}>{currency(p.total)}</div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function EstadoResultados() {
  const [selectedMonth, setSelectedMonth] = useState(monthKey(todayStr()));
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [openSet, setOpenSet] = useState(() => new Set());
  const [printExpand, setPrintExpand] = useState(false);

  useEffect(() => {
    const unsub = db.collection("entries").onSnapshot(
      (snap) => { setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); setError(null); },
      () => { setError("No se pudo cargar el informe."); setLoading(false); }
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    function onAfterPrint() { setPrintExpand(false); }
    window.addEventListener("afterprint", onAfterPrint);
    return () => window.removeEventListener("afterprint", onAfterPrint);
  }, []);

  const months = useMemo(() => {
    const set = new Set(entries.map((e) => monthKey(e.fecha)));
    set.add(monthKey(todayStr()));
    return Array.from(set).sort().reverse();
  }, [entries]);

  const monthEntries = useMemo(() => entries.filter((e) => monthKey(e.fecha) === selectedMonth), [entries, selectedMonth]);

  const diezmoEntries = useMemo(() => monthEntries.filter((e) => e.tipo === "diezmo").sort((a, b) => (a.fecha < b.fecha ? 1 : -1)), [monthEntries]);
  const ofrendaEntries = useMemo(() => monthEntries.filter((e) => e.tipo === "ofrenda").sort((a, b) => (a.fecha < b.fecha ? 1 : -1)), [monthEntries]);
  const salidaEntries = useMemo(() => monthEntries.filter((e) => e.tipo === "salida"), [monthEntries]);

  const salidasPorCategoria = useMemo(() => {
    const map = {};
    for (const e of salidaEntries) {
      const key = e.categoria && e.categoria.trim() ? e.categoria.trim() : "Sin categoría";
      if (!map[key]) map[key] = { total: 0, items: [] };
      map[key].total += e.monto;
      map[key].items.push(e);
    }
    return Object.entries(map)
      .map(([categoria, datos]) => ({ categoria, ...datos, items: datos.items.sort((a, b) => (a.fecha < b.fecha ? 1 : -1)) }))
      .sort((a, b) => b.total - a.total);
  }, [salidaEntries]);

  const totales = useMemo(() => {
    const diezmos = diezmoEntries.reduce((s, e) => s + e.monto, 0);
    const ofrendas = ofrendaEntries.reduce((s, e) => s + e.monto, 0);
    const salidas = salidaEntries.reduce((s, e) => s + e.monto, 0);
    const remesa = diezmos * PORCENTAJE_REMESA;
    const ingresos = diezmos + ofrendas;
    return { diezmos, ofrendas, salidas, remesa, ingresos, disponible: ingresos - remesa - salidas };
  }, [diezmoEntries, ofrendaEntries, salidaEntries]);

  function toggle(key) {
    setOpenSet((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  }

  function isOpen(key) {
    return printExpand || openSet.has(key);
  }

  function handlePrint() {
    setPrintExpand(true);
    setTimeout(() => window.print(), 150);
  }

  return (
    <div>
      <h1 className="rd-display" style={{ margin: "0 0 16px", fontSize: 24, fontWeight: 600 }}>Estado de resultados — {monthLabel(selectedMonth)}</h1>

      <PrintButton onClick={handlePrint} />

      <div className="rd-scroll no-print" style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4, marginBottom: 20 }}>
        {months.map((m) => (
          <button key={m} className="rd-btn rd-anim" onClick={() => setSelectedMonth(m)} style={{ flexShrink: 0, padding: "9px 15px", borderRadius: 999, fontSize: 14.5, fontWeight: 600, background: m === selectedMonth ? "var(--ink)" : "transparent", color: m === selectedMonth ? "var(--paper)" : "var(--muted)", border: `1px solid ${m === selectedMonth ? "var(--ink)" : "var(--paper-line)"}` }}>
            {monthLabel(m)}
          </button>
        ))}
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "var(--clay)", padding: "10px 14px", borderRadius: 10, fontSize: 14.5, marginBottom: 12 }}>{error}</div>}

      {loading ? (
        <div style={{ color: "var(--muted)", fontSize: 15.5, textAlign: "center", padding: "24px 0" }}>Cargando…</div>
      ) : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
            <SummaryCard iconName="trendUp" label="Total ingresos" value={totales.ingresos} color="var(--sage)" />
            <SummaryCard iconName="trendDown" label="Total gastos" value={totales.salidas} color="var(--clay)" />

          <AccountRow title="Diezmos" iconName="handCoins" color="var(--wood)" total={totales.diezmos} count={diezmoEntries.length} isOpen={isOpen("diezmos")} onToggle={() => toggle("diezmos")}>
            {diezmoEntries.length === 0 ? (
              <div style={{ fontSize: 13.5, color: "var(--muted)", padding: "6px 0" }}>Sin diezmos este mes.</div>

              <DetailLine key={e.id} left={e.persona || "Sin especificar"} sub={dateLabel(e.fecha)} right={currency(e.monto)} />

          <AccountRow title="Ofrendas" iconName="trendUp" color="var(--gold)" total={totales.ofrendas} count={ofrendaEntries.length} isOpen={isOpen("ofrendas")} onToggle={() => toggle("ofrendas")}>
            {ofrendaEntries.length === 0 ? (
              <div style={{ fontSize: 13.5, color: "var(--muted)", padding: "6px 0" }}>Sin ofrendas este mes.</div>
            ) : ofrendaEntries.map((e) => (
              <DetailLine key={e.id} left={e.persona || e.descripcion || "Ofrenda"} sub={dateLabel(e.fecha)} right={currency(e.monto)} />
            ))}
          </AccountRow>

          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, color: "var(--muted)", padding: "6px 4px 16px" }}>
            <span>Remesa a iglesia nacional (10% de diezmos)</span>
            <span className="rd-mono" style={{ color: "var(--wood)", fontWeight: 600 }}>− {currency(totales.remesa)}</span>
          </div>

          <div className="rd-display" style={{ fontSize: 13.5, fontWeight: 700, color: "var(--muted)", margin: "4px 0 8px", textTransform: "uppercase", letterSpacing: "0.06em" }}>Gastos / Salidas</div>

          {salidasPorCategoria.length === 0 ? (
            <div style={{ border: "1px dashed var(--paper-line)", borderRadius: 12, padding: "20px 16px", textAlign: "center", color: "var(--muted)", fontSize: 14.5, marginBottom: 16 }}>Sin salidas registradas este mes.</div>
          ) : salidasPorCategoria.map((cat) => (
            <AccountRow key={cat.categoria} title={cat.categoria} iconName="tags" color="var(--clay)" total={cat.total} count={cat.items.length} isOpen={isOpen("cat-" + cat.categoria)} onToggle={() => toggle("cat-" + cat.categoria)}>
              {cat.items.map((e) => (
                <DetailLine key={e.id} left={e.descripcion || "Sin descripción"} sub={dateLabel(e.fecha)} right={currency(e.monto)} />
              ))}
            </AccountRow>
          ))}

          <div className="rd-card-dark" style={{ background: "var(--ink)", borderRadius: 14, padding: "16px", marginTop: 20 }}>
            <div style={{ color: "rgba(250,246,240,0.65)", fontSize: 13.5, fontWeight: 600, marginBottom: 10 }}>Disponible neto para la iglesia local</div>
            <div style={{ fontSize: 13, color: "rgba(250,246,240,0.5)", marginBottom: 4 }}>(diezmos + ofrendas) − remesa 10% − gastos</div>
            <div className="rd-mono" style={{ color: "var(--paper)", fontSize: 23, fontWeight: 600, marginTop: 6 }}>{currency(totales.disponible)}</div>
          </div>
        </>
      )}
    </div>
  );
}

// ============ INFORME TRIMESTRAL ============
function InformeTrimestral() {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [quarter, setQuarter] = useState(Math.floor(today.getMonth() / 3) + 1);
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    const unsub = db.collection("entries").onSnapshot(
      (snap) => { setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); setError(null); },
      () => { setError("No se pudo cargar el informe."); setLoading(false); }
    );
    return () => unsub();
  }, []);

  const years = useMemo(() => {
    const set = new Set(entries.map((e) => Number(e.fecha.slice(0, 4))));
    set.add(today.getFullYear());
    return Array.from(set).sort((a, b) => b - a);
  }, [entries]);

  const monthsInQuarter = useMemo(() => {
    const startMonth = (quarter - 1) * 3 + 1;
    return [startMonth, startMonth + 1, startMonth + 2].map((m) => `${year}-${String(m).padStart(2, "0")}`);
  }, [year, quarter]);

  const monthStats = useMemo(() => {
    return monthsInQuarter.map((mKey) => {
      const monthEntries = entries.filter((e) => monthKey(e.fecha) === mKey);
      const diezmos = monthEntries.filter((e) => e.tipo === "diezmo").reduce((s, e) => s + e.monto, 0);
      const ofrendas = monthEntries.filter((e) => e.tipo === "ofrenda").reduce((s, e) => s + e.monto, 0);
      const remesa = diezmos * PORCENTAJE_REMESA;
      const salidaEntries = monthEntries.filter((e) => e.tipo === "salida");
      const categoriasMap = {};
      for (const e of salidaEntries) {
        const key = e.categoria && e.categoria.trim() ? e.categoria.trim() : "Sin categoría";
        categoriasMap[key] = (categoriasMap[key] || 0) + e.monto;
      }
      const salidas = salidaEntries.reduce((s, e) => s + e.monto, 0);
      const ingresos = diezmos + ofrendas;
      const balance = ingresos - remesa - salidas;
      return { mKey, diezmos, ofrendas, remesa, salidas, ingresos, balance, categoriasMap };
    });
  }, [entries, monthsInQuarter]);

  const categoriasOrden = useMemo(() => {
    const set = new Set();
    monthStats.forEach((m) => Object.keys(m.categoriasMap).forEach((c) => set.add(c)));
    return Array.from(set).sort();
  }, [monthStats]);

  const totalTrimestre = useMemo(() => {
    const diezmos = monthStats.reduce((s, m) => s + m.diezmos, 0);
    const ofrendas = monthStats.reduce((s, m) => s + m.ofrendas, 0);
    const remesa = monthStats.reduce((s, m) => s + m.remesa, 0);
    const salidas = monthStats.reduce((s, m) => s + m.salidas, 0);
    const ingresos = diezmos + ofrendas;
    const balance = ingresos - remesa - salidas;
    const categoriasMap = {};
    categoriasOrden.forEach((cat) => {
      categoriasMap[cat] = monthStats.reduce((s, m) => s + (m.categoriasMap[cat] || 0), 0);
    });
    return { diezmos, ofrendas, remesa, salidas, ingresos, balance, categoriasMap };
  }, [monthStats, categoriasOrden]);

  const cellStyle = { padding: "9px 12px", fontSize: 13.5, whiteSpace: "nowrap", textAlign: "right" };
  const labelCellStyle = { padding: "9px 12px", fontSize: 13.5, textAlign: "left", color: "var(--muted)", position: "sticky", left: 0, background: "#fff" };

  return (
    <div>
      <h1 className="rd-display" style={{ margin: "0 0 16px", fontSize: 24, fontWeight: 600 }}>Estado de resultados trimestral</h1>

      <PrintButton />

      <div className="no-print" style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
        <select className="rd-select" value={year} onChange={(e) => setYear(Number(e.target.value))} style={{ ...inputStyle, width: "auto", flex: "1 0 100px" }}>
          {years.map((y) => <option key={y} value={y}>{y}</option>)}
        </select>
        <select className="rd-select" value={quarter} onChange={(e) => setQuarter(Number(e.target.value))} style={{ ...inputStyle, width: "auto", flex: "1 0 160px" }}>
          <option value={1}>Trimestre 1 (Ene–Mar)</option>
          <option value={2}>Trimestre 2 (Abr–Jun)</option>
          <option value={3}>Trimestre 3 (Jul–Sep)</option>
          <option value={4}>Trimestre 4 (Oct–Dic)</option>
        </select>
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "var(--clay)", padding: "10px 14px", borderRadius: 10, fontSize: 14.5, marginBottom: 12 }}>{error}</div>}

      {loading ? (
        <div style={{ color: "var(--muted)", fontSize: 15.5, textAlign: "center", padding: "24px 0" }}>Cargando…</div>
      ) : (
        <div className="rd-scroll" style={{ overflowX: "auto", border: "1px solid var(--paper-line)", borderRadius: 14, background: "#fff" }}>
          <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 560 }}>
            <thead>
              <tr style={{ borderBottom: "2px solid var(--paper-line)" }}>
                <th style={{ ...labelCellStyle, fontWeight: 700, color: "var(--ink)" }}>Concepto</th>
                {monthStats.map((m) => (
                  <th key={m.mKey} className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--ink)" }}>{monthLabel(m.mKey).split(" ")[0]}</th>
                ))}
                <th className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--wood)", background: "#FBF3E9" }}>Total trimestre</th>
              </tr>
            </thead>
            <tbody>
              <tr style={{ borderBottom: "1px solid var(--paper-line)" }}>
                <td style={labelCellStyle}>Diezmos</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={cellStyle}>{currency(m.diezmos)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 600, background: "#FBF3E9" }}>{currency(totalTrimestre.diezmos)}</td>
              </tr>
              <tr style={{ borderBottom: "1px solid var(--paper-line)" }}>
                <td style={labelCellStyle}>Ofrendas</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={cellStyle}>{currency(m.ofrendas)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 600, background: "#FBF3E9" }}>{currency(totalTrimestre.ofrendas)}</td>
              </tr>
              <tr style={{ borderBottom: "1px solid var(--paper-line)" }}>
                <td style={{ ...labelCellStyle, fontWeight: 700, color: "var(--sage)", background: "#FAF6F0" }}>Total ingresos</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--sage)", background: "#FAF6F0" }}>{currency(m.ingresos)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--sage)", background: "#FBF3E9" }}>{currency(totalTrimestre.ingresos)}</td>
              </tr>
              <tr style={{ borderBottom: "1px solid var(--paper-line)" }}>
                <td style={labelCellStyle}>Remesa (10% diezmos)</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={cellStyle}>− {currency(m.remesa)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 600, background: "#FBF3E9" }}>− {currency(totalTrimestre.remesa)}</td>
              </tr>
              {categoriasOrden.map((cat) => (
                <tr key={cat} style={{ borderBottom: "1px solid var(--paper-line)" }}>
                  <td style={labelCellStyle}>{cat}</td>
                  {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={cellStyle}>{m.categoriasMap[cat] ? `− ${currency(m.categoriasMap[cat])}` : "—"}</td>)}
                  <td className="rd-mono" style={{ ...cellStyle, fontWeight: 600, background: "#FBF3E9" }}>{totalTrimestre.categoriasMap[cat] ? `− ${currency(totalTrimestre.categoriasMap[cat])}` : "—"}</td>
                </tr>
              ))}
              <tr style={{ borderBottom: "1px solid var(--paper-line)" }}>
                <td style={{ ...labelCellStyle, fontWeight: 700, color: "var(--clay)" }}>Total gastos</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--clay)" }}>− {currency(m.salidas)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--clay)", background: "#FBF3E9" }}>− {currency(totalTrimestre.salidas)}</td>
              </tr>
              <tr>
                <td style={{ ...labelCellStyle, fontWeight: 700, color: "var(--paper)", background: "var(--ink)" }}>Balance</td>
                {monthStats.map((m) => <td key={m.mKey} className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--paper)", background: "var(--ink)" }}>{currency(m.balance)}</td>)}
                <td className="rd-mono" style={{ ...cellStyle, fontWeight: 700, color: "var(--paper)", background: "var(--ink)" }}>{currency(totalTrimestre.balance)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ============ REGISTRO (pantalla principal) ============
function Ledger({ user }) {
  const [entries, setEntries] = useState([]);
  const [members, setMembers] = useState([]);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [selectedMonth, setSelectedMonth] = useState(monthKey(todayStr()));
  const [filtroTipo, setFiltroTipo] = useState(null);
  const [editingId, setEditingId] = useState(null);

  const [form, setForm] = useState({ fecha: todayStr(), tipo: "diezmo", monto: "", descripcion: "", persona: "", categoria: "", metodoPago: "efectivo" });

  useEffect(() => {
    const unsub = db.collection("entries").orderBy("fecha", "desc").onSnapshot(
      (snap) => { setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); setError(null); },
      () => { setError("No se pudieron cargar los registros. Revisa tu conexión."); setLoading(false); }
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    const unsub = db.collection("members").orderBy("nombre").onSnapshot((snap) => setMembers(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return () => unsub();
  }, []);

  useEffect(() => {
    const unsub = db.collection("categories").orderBy("nombre").onSnapshot((snap) => setCategories(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return () => unsub();
  }, []);

  const [savedFlash, setSavedFlash] = useState(false);
  const montoRef = useRef(null);

  function resetForm() {
    setForm({ fecha: todayStr(), tipo: "diezmo", monto: "", descripcion: "", persona: "", categoria: "", metodoPago: "efectivo" });
  }

  function closeForm() {
    setShowForm(false);
    setEditingId(null);
    resetForm();
  }

  function openNewForm() {
    resetForm();
    setEditingId(null);
    setShowForm(true);
  }

  function openEditForm(entry) {
    setForm({
      fecha: entry.fecha, tipo: entry.tipo, monto: String(entry.monto),
      descripcion: entry.descripcion || "", persona: entry.persona || "",
      categoria: entry.categoria || "", metodoPago: entry.metodoPago || "efectivo",
    });
    setEditingId(entry.id);
    setShowForm(true);
  }

  async function handleCreateMember(nombre) {
    const trimmed = nombre.trim();
    if (!trimmed) return;
    const yaExiste = members.some((m) => m.nombre.trim().toLowerCase() === trimmed.toLowerCase());
    if (yaExiste) return;
    try {
      await db.collection("members").add({ nombre: trimmed });
    } catch (err) {
      // Si falla el guardado del miembro, igual dejamos el nombre en el movimiento.
    }
  }

  async function handleCreateCategory(nombre) {
    const trimmed = nombre.trim();
    if (!trimmed) return;
    const yaExiste = categories.some((c) => c.nombre.trim().toLowerCase() === trimmed.toLowerCase());
    if (yaExiste) return;
    try {
      await db.collection("categories").add({ nombre: trimmed });
    } catch (err) {
      // Si falla el guardado de la categoría, igual dejamos el nombre en el movimiento.
    }
  }

  async function handleSave(e) {
    e.preventDefault();
    if (!form.fecha || !form.monto || Number(form.monto) <= 0) return;
    const payload = {
      fecha: form.fecha, tipo: form.tipo, monto: Number(form.monto),
      descripcion: form.descripcion.trim(), persona: form.persona.trim(),
      categoria: form.tipo === "salida" ? form.categoria : "",
      metodoPago: form.metodoPago,
    };
    try {
      if (editingId) {
        await db.collection("entries").doc(editingId).update(payload);
        closeForm();
      } else {
        await db.collection("entries").add({
          ...payload,
          creadoPor: user.email,
          creado: firebase.firestore.FieldValue.serverTimestamp(),
        });
        // Deja la fecha, el tipo, la categoría y el método de pago igual para poder
        // seguir agregando movimientos rápido (por ejemplo varios diezmos del mismo domingo).
        setForm((f) => ({ ...f, monto: "", descripcion: "", persona: "" }));
        setSavedFlash(true);
        setTimeout(() => setSavedFlash(false), 1300);
        if (montoRef.current) montoRef.current.focus();
      }
    } catch (err) {
      setError("No se pudo guardar el movimiento. Intenta de nuevo.");
    }
  }

  async function handleDelete(id) {
    try {
      await db.collection("entries").doc(id).delete();
    } catch (err) {
      setError("No se pudo eliminar el movimiento.");
    }
  }

  const months = useMemo(() => {
    const set = new Set(entries.map((e) => monthKey(e.fecha)));
    set.add(monthKey(todayStr()));
    return Array.from(set).sort().reverse();
  }, [entries]);

  const monthEntries = useMemo(() => entries.filter((e) => monthKey(e.fecha) === selectedMonth).sort((a, b) => (a.fecha < b.fecha ? 1 : -1)), [entries, selectedMonth]);

  const totals = useMemo(() => {
    let diezmos = 0, ofrendas = 0, salidas = 0;
    for (const e of monthEntries) {
      if (e.tipo === "diezmo") diezmos += e.monto;
      else if (e.tipo === "ofrenda") ofrendas += e.monto;
      else if (e.tipo === "salida") salidas += e.monto;
    }
    return { diezmos, ofrendas, salidas, balance: diezmos + ofrendas - salidas };
  }, [monthEntries]);

  const visibleEntries = useMemo(() => (filtroTipo ? monthEntries.filter((e) => e.tipo === filtroTipo) : monthEntries), [monthEntries, filtroTipo]);

  function toggleFiltro(tipo) {
    setFiltroTipo((f) => (f === tipo ? null : tipo));
  }

  return (
    <div>
      <h1 className="rd-display" style={{ margin: "0 0 16px", fontSize: 26, fontWeight: 600, color: "var(--ink)" }}>Diezmos, ofrendas y salidas</h1>

      <div className="rd-scroll" style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4, marginBottom: 16 }}>
        {months.map((m) => (
          <button key={m} className="rd-btn rd-anim" onClick={() => setSelectedMonth(m)} style={{ flexShrink: 0, padding: "9px 15px", borderRadius: 999, fontSize: 14.5, fontWeight: 600, background: m === selectedMonth ? "var(--ink)" : "transparent", color: m === selectedMonth ? "var(--paper)" : "var(--muted)", border: `1px solid ${m === selectedMonth ? "var(--ink)" : "var(--paper-line)"}` }}>
            {monthLabel(m)}
          </button>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
        <SummaryCard iconName="handCoins" label="Diezmos" value={totals.diezmos} color="var(--wood)" onClick={() => toggleFiltro("diezmo")} active={filtroTipo === "diezmo"} />
        <SummaryCard iconName="trendUp" label="Ofrendas" value={totals.ofrendas} color="var(--gold)" onClick={() => toggleFiltro("ofrenda")} active={filtroTipo === "ofrenda"} />
        <SummaryCard iconName="trendDown" label="Salidas" value={totals.salidas} color="var(--clay)" onClick={() => toggleFiltro("salida")} active={filtroTipo === "salida"} />
        <button className="rd-btn rd-anim rd-card-dark" type="button" onClick={() => setFiltroTipo(null)} style={{ background: "var(--ink)", borderRadius: 16, padding: "14px 16px", display: "flex", flexDirection: "column", justifyContent: "space-between", textAlign: "left", width: "100%", boxSizing: "border-box" }}>
          <div style={{ color: "rgba(250,246,240,0.65)", fontSize: 13.5, fontWeight: 600, marginBottom: 8 }}>Balance</div>
          <div className="rd-mono" style={{ color: "var(--paper)", fontSize: 22, fontWeight: 600 }}>{currency(totals.balance)}</div>
        </button>
      </div>

      <div className="rd-card" style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 16, padding: "16px", marginBottom: 20 }}>
        <div className="rd-display" style={{ fontSize: 15, fontWeight: 600, color: "var(--muted)", marginBottom: 12 }}>Tendencia — últimos 6 meses</div>
        <TrendChart entries={entries} />
      </div>

      <div style={{ marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
        <div className="rd-display" style={{ fontSize: 16.5, fontWeight: 600, color: "var(--muted)" }}>
          {visibleEntries.length} {visibleEntries.length === 1 ? "movimiento" : "movimientos"}
          {filtroTipo ? ` · ${TIPOS[filtroTipo].label}s` : ""}
        </div>
        {filtroTipo && (
          <button className="rd-btn" onClick={() => setFiltroTipo(null)} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 13, color: "var(--muted)", fontWeight: 600 }}>
            <Icon name="x" size={13} /> Ver todos
          </button>
        )}
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "var(--clay)", padding: "10px 14px", borderRadius: 10, fontSize: 13, marginBottom: 12 }}>{error}</div>}

      {loading ? (
        <div style={{ color: "var(--muted)", fontSize: 14, padding: "24px 0", textAlign: "center" }}>Cargando registros…</div>
      ) : visibleEntries.length === 0 ? (
        <div style={{ border: "1px dashed var(--paper-line)", borderRadius: 14, padding: "32px 16px", textAlign: "center", color: "var(--muted)" }}>
          <Icon name="receipt" size={22} color="var(--muted)" style={{ marginBottom: 8, opacity: 0.6 }} />
          <div style={{ fontSize: 14 }}>Sin movimientos {filtroTipo ? `de ${TIPOS[filtroTipo].label.toLowerCase()}s` : ""} este mes.</div>
          <div style={{ fontSize: 13 }}>Toca el botón + para registrar el primero.</div>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {visibleEntries.map((e) => {
            const meta = TIPOS[e.tipo];
            return (
              <div key={e.id} onClick={() => openEditForm(e)} role="button" tabIndex={0} className="rd-card" style={{ display: "flex", alignItems: "center", gap: 12, background: "#fff", border: "1px solid var(--paper-line)", borderLeft: `4px solid ${meta.color}`, borderRadius: 12, padding: "12px 14px", cursor: "pointer" }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 2 }}>
                    <span style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: meta.color }}>{meta.label}</span>
                    {e.categoria && <span style={{ fontSize: 12.5, color: "var(--muted)" }}>· {e.categoria}</span>}
                  </div>
                  <div style={{ fontSize: 15.5, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.descripcion || e.persona || "Sin descripción"}</div>
                  <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>
                    {new Date(e.fecha + "T00:00:00").toLocaleDateString("es-CR", { day: "2-digit", month: "short" })}
                    {e.persona && e.descripcion ? ` · ${e.persona}` : ""}
                    {e.metodoPago ? ` · ${METODOS_PAGO.find((mp) => mp.key === e.metodoPago)?.label || e.metodoPago}` : ""}
                    {e.creadoPor ? ` · ${e.creadoPor.split("@")[0]}` : ""}
                  </div>
                </div>
                <div className="rd-mono" style={{ fontSize: 16.5, fontWeight: 600, color: meta.sign > 0 ? "var(--sage)" : "var(--clay)", whiteSpace: "nowrap" }}>
                  {meta.sign > 0 ? "+" : "−"}{currency(e.monto).replace("−", "").replace("-", "")}
                </div>
                <button className="rd-btn" onClick={(ev) => { ev.stopPropagation(); handleDelete(e.id); }} aria-label="Eliminar movimiento" style={{ color: "var(--muted)", padding: 4, display: "flex" }}>
                  <Icon name="trash" size={15} />
                </button>
              </div>
            );
          })}
        </div>
      )}

      <button className="rd-btn rd-anim" onClick={openNewForm} aria-label="Agregar movimiento" style={{ position: "fixed", bottom: 88, right: 24, width: 56, height: 56, borderRadius: "50%", background: "var(--ink)", color: "var(--paper)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 6px 20px rgba(43,36,32,0.3)", zIndex: 41 }}>
        <Icon name="plus" size={24} />
      </button>

      {showForm && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(43,36,32,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }} onClick={closeForm}>
          <form onSubmit={handleSave} onClick={(e) => e.stopPropagation()} style={{ background: "var(--paper)", borderRadius: "20px 20px 0 0", padding: "20px 20px 28px", width: "100%", maxWidth: 480, maxHeight: "88vh", overflowY: "auto", boxSizing: "border-box" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div className="rd-display" style={{ fontSize: 20, fontWeight: 600 }}>{editingId ? "Editar movimiento" : "Nuevo movimiento"}</div>
              <button className="rd-btn" type="button" onClick={closeForm} style={{ color: "var(--muted)" }}>
                <Icon name="x" size={20} />
              </button>
            </div>

            {savedFlash && (
              <div style={{ background: "#EAF2EC", color: "var(--sage)", padding: "9px 14px", borderRadius: 10, fontSize: 14, fontWeight: 600, marginBottom: 14, display: "flex", alignItems: "center", gap: 8 }}>
                <Icon name="trendUp" size={15} color="var(--sage)" /> Guardado — puedes agregar el siguiente
              </div>
            )}

            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              {Object.entries(TIPOS).map(([key, meta]) => (
                <button key={key} type="button" className="rd-btn" onClick={() => setForm((f) => ({ ...f, tipo: key, categoria: "" }))} style={{ flex: 1, padding: "10px 0", borderRadius: 10, fontSize: 14.5, fontWeight: 600, background: form.tipo === key ? meta.color : "#fff", color: form.tipo === key ? "#fff" : "var(--ink)", border: `1px solid ${form.tipo === key ? meta.color : "var(--paper-line)"}` }}>
                  {meta.label}
                </button>
              ))}
            </div>

            <Field label="Fecha">
              <DateSelect value={form.fecha} maxDate={todayStr()} onChange={(v) => setForm((f) => ({ ...f, fecha: v }))} />
            </Field>

            <Field label="Monto (₡)">
              <input ref={montoRef} className="rd-input rd-mono" type="number" inputMode="decimal" min="1" step="1" placeholder="0" value={form.monto} onChange={(e) => setForm((f) => ({ ...f, monto: e.target.value }))} required style={inputStyle} />
            </Field>

            {form.tipo === "salida" && (
              <Field label="Categoría">
                <SearchCreatePicker
                  value={form.categoria}
                  options={categories}
                  onChange={(v) => setForm((f) => ({ ...f, categoria: v }))}
                  onCreate={handleCreateCategory}
                  placeholder="Escribe para buscar o agregar…"
                  emptyText="Aún no hay categorías cargadas."
                  createLabel="Agregar categoría"
                />
              </Field>
            )}

            <Field label="Método de pago">
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {METODOS_PAGO.map((mp) => (
                  <button key={mp.key} type="button" className="rd-btn" onClick={() => setForm((f) => ({ ...f, metodoPago: mp.key }))} style={{ flex: "1 0 auto", padding: "9px 14px", borderRadius: 999, fontSize: 14, fontWeight: 600, background: form.metodoPago === mp.key ? "var(--ink)" : "#fff", color: form.metodoPago === mp.key ? "var(--paper)" : "var(--muted)", border: `1px solid ${form.metodoPago === mp.key ? "var(--ink)" : "var(--paper-line)"}` }}>
                    {mp.label}
                  </button>
                ))}
              </div>
            </Field>

            <Field label={form.tipo === "salida" ? "¿A quién se le pagó / persona responsable? (opcional)" : "¿De quién es? (opcional)"}>
              <SearchCreatePicker
                value={form.persona}
                options={members}
                onChange={(v) => setForm((f) => ({ ...f, persona: v }))}
                onCreate={handleCreateMember}
                placeholder="Escribe para buscar o agregar…"
                emptyText="Aún no hay miembros ni familias cargados."
                createLabel="Agregar miembro"
              />
            </Field>

            <Field label="Descripción (opcional)">
              <input className="rd-input" type="text" placeholder="Notas adicionales" value={form.descripcion} onChange={(e) => setForm((f) => ({ ...f, descripcion: e.target.value }))} style={inputStyle} />
            </Field>

            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              {editingId && (
                <button className="rd-btn" type="button" onClick={() => { handleDelete(editingId); closeForm(); }} style={{ padding: "13px 18px", borderRadius: 10, background: "#FBEAE5", color: "var(--clay)", fontSize: 15, fontWeight: 600 }}>
                  <Icon name="trash" size={16} color="var(--clay)" />
                </button>
              )}
              <button className="rd-btn" type="submit" style={{ flex: 1, padding: "13px 0", borderRadius: 10, background: "var(--ink)", color: "var(--paper)", fontSize: 16, fontWeight: 600 }}>
                {editingId ? "Guardar cambios" : "Guardar movimiento"}
              </button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

// ============ SHELL (nav inferior + logout) ============
function NavButton({ active, onClick, iconName, label }) {
  return (
    <button className="rd-btn" onClick={onClick} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "6px 0", borderRadius: 10, color: active ? "var(--ink)" : "var(--muted)" }}>
      <Icon name={iconName} size={19} />
      <span style={{ fontSize: 12.5, fontWeight: 600 }}>{label}</span>
    </button>
  );
}

function Shell({ user }) {
  const [tab, setTab] = useState("ledger");
  return (
    <div className="app-shell" style={{ ...theme, fontFamily: "'Public Sans', system-ui, sans-serif", background: "var(--paper)", color: "var(--ink)", minHeight: "100vh", width: "100%", boxSizing: "border-box", padding: "20px 16px 88px" }}>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 20 }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, color: "var(--muted)", fontSize: 13.5, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 4 }}>
            <Icon name="wallet" size={14} />
            <span>Libro de Tesorería</span>
          </div>
          <div style={{ fontSize: 13.5, color: "var(--muted)" }}>{user.email}</div>
        </div>
        <button className="rd-btn no-print" onClick={() => auth.signOut()} aria-label="Cerrar sesión" style={{ color: "var(--muted)", padding: 6, display: "flex" }}>
          <Icon name="logout" size={18} />
        </button>
      </div>

      {tab === "ledger" && <Ledger user={user} />}
      {tab === "report" && <Report />}
      {tab === "settings" && <Settings />}

      <div className="no-print" style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#fff", borderTop: "1px solid var(--paper-line)", display: "flex", padding: "8px 12px calc(8px + env(safe-area-inset-bottom))", gap: 4, zIndex: 40 }}>
        <NavButton active={tab === "ledger"} onClick={() => setTab("ledger")} iconName="book" label="Registro" />
        <NavButton active={tab === "report"} onClick={() => setTab("report")} iconName="bars" label="Informe" />
        <NavButton active={tab === "settings"} onClick={() => setTab("settings")} iconName="sliders" label="Ajustes" />
      </div>
    </div>
  );
}

// ============ APP RAIZ ============
function App() {
  const [user, setUser] = useState(undefined);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => setUser(u));
    return () => unsub();
  }, []);

  if (user === undefined) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#FAF6F0", color: "#8A7F6E", fontFamily: "system-ui" }}>Cargando…</div>;
  }
  if (!user) return <Login />;
  return <Shell user={user} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
